# YAML config for scripts/perplexity.py
#
# Usage:
# pixi r -e llamacpp-source-cuda perplexity   # the task exists in all eight llamacpp-* envs
# pixi r perplexity-report

# Common flags prepended to every llama-perplexity invocation.
# The baseline run omits --kl-divergence to create the baseline logits, then is
# rerun with --kl-divergence against its own logits to measure the noise floor
# (KLD / top-1) and the reference speed without logits-dump I/O.
# All other runs append their own flags plus --kl-divergence.
#
# --kl-divergence-base is mandatory here, and so is everything that fixes the
# dump's contents (-f, --ctx-size, --chunks): every run is compared against that
# one dump, so those may not vary between runs.

common: >
    llama-perplexity --kl-divergence-base /tmp/logits.dat
    --ctx-size 32768 -f sample-data/wiki.test.head-2.4k.raw
    -fa on

# Baseline combo that creates the logits dump (no --kl-divergence).
# Exempt from `exclude` and from the auto-skips: without it there is no sweep.
# The BF16 reference is also listed in the model list below, so the reference
# weights ride the whole KV sweep as its topmost accuracy point; the one combo
# that would repeat the baseline itself (f16/f16) is skipped by its signature.
baseline: {hf-repo: LiquidAI/LFM3-1.7B-GGUF:BF16, cache-type-k: f16, cache-type-v: f16}

# Cartesian product of lists of llama-perplexity option dicts, expanded into every union
# of one dict per list.  Keys are flag names without the leading dashes, emitted as
# `--<key> <value>`; use the long spelling (`hf-repo`, not `hf`). An option may only be
# varied by one list: a key appearing in two lists of the same product is a config
# error.
#
# Auto-skipped: every combo whose V quant is finer than its K quant, every asymmetric
# KVarN pair, and a non-zero tail on an exact f16/f16 cache.
cross-product:
  - - {hf-repo: LiquidAI/LFM3-1.7B-GGUF:Q8_0}
    # - {hf-repo: LiquidAI/LFM3-1.7B-GGUF:Q6_K}
    # - {hf-repo: LiquidAI/LFM3-1.7B-GGUF:Q5_K_M}
    # - {hf-repo: LiquidAI/LFM3-1.7B-GGUF:Q4_K_M}
    # - {hf-repo: LiquidAI/LFM3-1.7B-GGUF:QAD-Q4_0}

    # - {hf-repo: AtomicChat/LFM3-1.7B-GGUF:AD-Q6_K}
    # - {hf-repo: AtomicChat/LFM3-1.7B-GGUF:AD-Q5_K_M}
    # - {hf-repo: AtomicChat/LFM3-1.7B-GGUF:AD-Q4_K_M}
    # - {hf-repo: AtomicChat/LFM3-1.7B-GGUF:AD-IQ4_XS}
    # - {hf-repo: AtomicChat/LFM3-1.7B-GGUF:AD-IQ3_S}

    # - {hf-repo: NANI-Nithin/LFM3-1.7B-GGUF:Q6_K}  # Identical to LiquidAI
    # - {hf-repo: NANI-Nithin/LFM3-1.7B-GGUF:Q5_K_M}
    # - {hf-repo: NANI-Nithin/LFM3-1.7B-GGUF:Q5_K_S}
    # - {hf-repo: NANI-Nithin/LFM3-1.7B-GGUF:Q4_K_M}
    # - {hf-repo: NANI-Nithin/LFM3-1.7B-GGUF:Q4_K_S}
    # - {hf-repo: NANI-Nithin/LFM3-1.7B-GGUF:IQ4_NL}
    # - {hf-repo: NANI-Nithin/LFM3-1.7B-GGUF:IQ4_XS}
    # - {hf-repo: NANI-Nithin/LFM3-1.7B-GGUF:Q3_K_L}
    # - {hf-repo: NANI-Nithin/LFM3-1.7B-GGUF:Q3_K_M}
    # - {hf-repo: NANI-Nithin/LFM3-1.7B-GGUF:Q3_K_S}
    # - {hf-repo: NANI-Nithin/LFM3-1.7B-GGUF:IQ3_M}
    # - {hf-repo: NANI-Nithin/LFM3-1.7B-GGUF:IQ3_S}
    # - {hf-repo: NANI-Nithin/LFM3-1.7B-GGUF:IQ3_XS}

    # - {hf-repo: bartowski/LFM3-1.7B-GGUF:Q6_K_L}
    # - {hf-repo: bartowski/LFM3-1.7B-GGUF:Q6_K}
    - {hf-repo: bartowski/LFM3-1.7B-GGUF:Q6_K_S}
    # - {hf-repo: bartowski/LFM3-1.7B-GGUF:Q5_K_M}
    # - {hf-repo: bartowski/LFM3-1.7B-GGUF:Q5_K_S}
    # - {hf-repo: bartowski/LFM3-1.7B-GGUF:Q4_K_L}
    # - {hf-repo: bartowski/LFM3-1.7B-GGUF:Q4_K_M}
    # - {hf-repo: bartowski/LFM3-1.7B-GGUF:Q4_K_S}
    # - {hf-repo: bartowski/LFM3-1.7B-GGUF:IQ4_XS}
    # - {hf-repo: bartowski/LFM3-1.7B-GGUF:Q3_K_L}
    # - {hf-repo: bartowski/LFM3-1.7B-GGUF:Q3_K_M}
    # - {hf-repo: bartowski/LFM3-1.7B-GGUF:Q3_K_S}
    # - {hf-repo: bartowski/LFM3-1.7B-GGUF:IQ3_M}
    # - {hf-repo: bartowski/LFM3-1.7B-GGUF:IQ3_XS}
    # - {hf-repo: bartowski/LFM3-1.7B-GGUF:IQ3_XXS}

    # - {hf-repo: kaitchup/LFM3-1.7B-SLQ-GGUF:Q6_K}
    # - {hf-repo: kaitchup/LFM3-1.7B-GSQ-GGUF:IQ4_XS_RCO}
    # - {hf-repo: kaitchup/LFM3-1.7B-GSQ-GGUF:Q6_K_RCO}
    - {hf-repo: kaitchup/LFM3-1.7B-GSQ-GGUF:Q6_K_SLQ}
    # - {hf-repo: turintech/LFM3-1.7B-Artemis-GGUF:Q4_K_M}
    - {hf-repo: Arki05/LFM3-1.7B-GGUF:2.97bpw}
    - {hf-repo: Arki05/LFM3-1.7B-GGUF:3.57bpw}
    - {hf-repo: Arki05/LFM3-1.7B-GGUF:4.22bpw}
    - {hf-repo: Arki05/LFM3-1.7B-GGUF:5.01bpw}
    - {hf-repo: Arki05/LFM3-1.7B-GGUF:5.78bpw}
    - {hf-repo: Arki05/LFM3-1.7B-GGUF:6.56bpw}

  - - {cache-type-k: f16, cache-type-v: f16}
    - {cache-type-k: q8_0, cache-type-v: q8_0}
    - {cache-type-k: q8_0, cache-type-v: q6_0}
    - {cache-type-k: q8_0, cache-type-v: q5_0}
    - {cache-type-k: q6_0, cache-type-v: q6_0}
    - {cache-type-k: q6_0, cache-type-v: q5_0}
    - {cache-type-k: q6_0, cache-type-v: q4_0}
    - {cache-type-k: q5_0, cache-type-v: q5_0}
    - {cache-type-k: q5_0, cache-type-v: q4_0}
    - {cache-type-k: q5_0, cache-type-v: q3_0}
    - {cache-type-k: q4_0, cache-type-v: q4_0}
    - {cache-type-k: q4_0, cache-type-v: q3_0}

    - {cache-type-k: q5_0, cache-type-v: q4_0, kv-tail-tokens: 1024}
    - {cache-type-k: q5_0, cache-type-v: q3_0, kv-tail-tokens: 1024}
    - {cache-type-k: q4_0, cache-type-v: q4_0, kv-tail-tokens: 1024}
    - {cache-type-k: q4_0, cache-type-v: q3_0, kv-tail-tokens: 1024}

# Extra combos beyond the cross-product, in the same syntax.
# Unlike the cross-product these are never auto-skipped -- an explicit request
# is taken as intentional -- but `exclude` still applies to them.
include: []

# Drop every combo that matches *all* the keys of an entry, whatever its other
# options: `{cache-type-k: q4_0}` removes every q4_0 key cache, at any V quant,
# tail or model.
exclude: []

# Abort non-baseline runs whose ETA exceeds baseline_eta * max_eta_factor.
# Set to 0 to disable the abort check entirely.
max_eta_factor: 4.0
