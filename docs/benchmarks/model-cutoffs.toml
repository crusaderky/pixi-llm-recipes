# Static table of model training-data cutoff dates for contamination control.
#
# Used by the lightweight panel (docs/benchmarks/06-livecodebench.md especially)
# to validate that the chosen LiveCodeBench date window starts AFTER the model's
# training-data cutoff, so the score isn't dominated by memorization.
#
# Lookup contract (enforced by lookup_cutoff.py, which the runners call):
#   - The runner normalizes the model id (lowercase; strip HF repo prefix,
#     GGUF ":quant" tag, and common suffixes like -bench / -iq4_xs / -it).
#   - It matches against each entry's `key` and `aliases`.
#   - If NO entry matches, the runner CRASHES (exit 2) with instructions on how
#     to add the model here. It does NOT silently fall back.
#   - `cutoff` is the training-data cutoff, used as the comparison bound:
#       window_start > cutoff  =>  contamination posture holds.
#     - A precise documented date is used as-is.
#     - A vendor "year-level" claim (e.g. Qwen "2026") is too coarse (it would
#       void contamination control for the entire year), so `cutoff` is set to
#       the RELEASE date instead — a hard upper bound (a model cannot have
#       trained on data released after it). The year-level claim is recorded in
#       `source`. Confidence = "year-level".
#     - An UNDOCUMENTED cutoff with a known release date uses the release date
#       as a proxy upper bound. Confidence = "proxy".
#     - `cutoff = "unknown"` means no usable bound is known; the runner WARNS
#       (contamination posture void) but does not crash — the model IS in the
#       table. Confidence = "unknown".
#   - `confidence` ∈ {documented, year-level, proxy, inherited, unknown}.
#   - `inherited` = the model is a post-train of a documented base; cutoff is
#     the base's cutoff.
#
# To add a model: append a [[models]] block (key, cutoff, released, confidence,
# source, optional aliases) and re-run. Last reviewed 2026-06-17.

# ---------------------------------------------------------------------------
# Local models (every preset in models.ini)
# ---------------------------------------------------------------------------

