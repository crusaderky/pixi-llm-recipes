# YAML config for scripts/kv-perplexity.py
#
# Usage:
# pixi r kv-perplexity
# pixi r kv-kld-report

# Common flags prepended to every llama-perplexity invocation.
# The baseline run (first combo) omits --kl-divergence to create baseline logits,
# then is rerun with --kl-divergence against its own logits to measure the noise
# floor (KLD / RMS Δp / top-1) and the reference speed without logits-dump I/O.
# All other combos append -ctk <kq> -ctv <vq> [--kv-tail-tokens <n>] --kl-divergence.

common: >
    llama-perplexity --kl-divergence-base /tmp/logits.dat
    --ctx-size 32768 -f sample-data/wiki.test.head-2.4k.raw
    -hf owao/Nanbeige4.2-3B-GGUF:Q4_K_M
    -fa on -ngl 99

# K-quant types to test.
k_quants:
  - kvarn4
  - kvarn3
  - kvarn2

# V-quant types to test (cartesian product with k_quants).
# Auto-skip all combos where v_quant is higher precision than k_quant
# Auto-skip all combos of asymmetric kvarn
v_quants:
  - kvarn4
  - kvarn3
  - kvarn2

# f16/bf16 KV-cache tail sizes to test (requires beellama.cpp). 0 = no tail
kv-tail-tokens: [0, 1024, 2048]

# Baseline combo that creates logits.dat (no --kl-divergence).
baseline: {cache-type-k: f16, cache-type-v: f16, kv-tail-tokens: 0}

# Extra combos to add beyond the cartesian product (same syntax as baseline)
include:
  - {cache-type-k: kvarn8, cache-type-v: kvarn8, kv-tail-tokens: 0}
  - {cache-type-k: kvarn6, cache-type-v: kvarn6, kv-tail-tokens: 0}
  - {cache-type-k: kvarn5, cache-type-v: kvarn5, kv-tail-tokens: 0}
  - {cache-type-k: kvarn5, cache-type-v: kvarn5, kv-tail-tokens: 1024}

  - {cache-type-k: f16, cache-type-v: q8_0, kv-tail-tokens: 0}
  - {cache-type-k: q8_0, cache-type-v: q8_0, kv-tail-tokens: 0}
  - {cache-type-k: q8_0, cache-type-v: q8_0, kv-tail-tokens: 128}
  - {cache-type-k: q8_0, cache-type-v: q5_0, kv-tail-tokens: 0}
  - {cache-type-k: q8_0, cache-type-v: q5_0, kv-tail-tokens: 128}
  - {cache-type-k: q6_0, cache-type-v: q6_0, kv-tail-tokens: 0}
  - {cache-type-k: q6_0, cache-type-v: q6_0, kv-tail-tokens: 128}

  - {cache-type-k: q5_0, cache-type-v: q5_0, kv-tail-tokens: 0}
  - {cache-type-k: q5_0, cache-type-v: q5_0, kv-tail-tokens: 128}
  - {cache-type-k: q5_0, cache-type-v: q5_0, kv-tail-tokens: 1024}

  - {cache-type-k: q4_0, cache-type-v: q4_0, kv-tail-tokens: 0}
  - {cache-type-k: q4_0, cache-type-v: q4_0, kv-tail-tokens: 128}
  - {cache-type-k: q4_0, cache-type-v: q4_0, kv-tail-tokens: 1024}
  - {cache-type-k: q4_0, cache-type-v: q4_0, kv-tail-tokens: 2048}

  - {cache-type-k: q3_0, cache-type-v: q3_0, kv-tail-tokens: 0}
  - {cache-type-k: q3_0, cache-type-v: q3_0, kv-tail-tokens: 128}
  - {cache-type-k: q3_0, cache-type-v: q3_0, kv-tail-tokens: 1024}
  - {cache-type-k: q3_0, cache-type-v: q3_0, kv-tail-tokens: 2048}

  - {cache-type-k: q2_0, cache-type-v: q2_0, kv-tail-tokens: 0}
  - {cache-type-k: q2_0, cache-type-v: q2_0, kv-tail-tokens: 128}
  - {cache-type-k: q2_0, cache-type-v: q2_0, kv-tail-tokens: 1024}
  - {cache-type-k: q2_0, cache-type-v: q2_0, kv-tail-tokens: 2048}

# Combos to remove from the cartesian product (same syntax as baseline)
exclude: []

# Abort non-baseline runs whose ETA exceeds baseline_eta * max_eta_factor.
# Set to 0 to disable the abort check entirely.
max_eta_factor: 4.0
