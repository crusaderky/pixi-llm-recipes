context:
  name: claude
  version: "2.1.270"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@anthropic-ai/claude-code/-/claude-code-${{ version }}.tgz
  sha256: ee37736066e3349c977db70bdfaf4f3cf7c398a06e2a051fe8e00728e1f6e932

build:
  number: 0
  script:
    # Extension-less: resolves to build.sh on Linux and build.bat on Windows
    file: build
    env:
      target_platform: ${{ target_platform }}
  dynamic_linking:
    binary_relocation: false

requirements:
  build:
    # conda-forge's pnpm 12+ ships a native launcher binary, and the
    # linux-aarch64 build contains an x86-64 ELF (Exec format error). Up to 11.x
    # the package is a plain `#!/usr/bin/env node` script, which runs anywhere.
    - pnpm <12
    - pnpm-licenses
    - nodejs
  run:
    - nodejs >=18.0.0

tests:
  - requirements:
      run:
        - nodejs
    script:
      - claude --version

about:
  summary: Claude Code - Anthropic's agentic coding CLI
  license: MIT
  license_file:
    - LICENSE.md
    - third-party-licenses.txt
  homepage: https://claude.ai/code
  repository: https://github.com/anthropics/claude-code
