context:
  name: claude
  version: "2.1.183"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@anthropic-ai/claude-code/-/claude-code-${{ version }}.tgz
  sha256: 52e40b885add22252dc60d93a0d70f5873bccc3acbe8afdf43866a3a812f4644

build:
  number: 0
  script:
    # Extension-less: resolves to build.sh on Linux and build.bat on Windows
    file: build
    env:
      target_platform: ${{ target_platform }}
  dynamic_linking:
    binary_relocation: false

requirements:
  build:
    - pnpm
    - pnpm-licenses
    - nodejs
  run:
    - nodejs >=18.0.0

tests:
  - requirements:
      run:
        - nodejs
    script:
      - claude --version

about:
  summary: Claude Code - Anthropic's agentic coding CLI
  license: MIT
  license_file:
    - LICENSE.md
    - third-party-licenses.txt
  homepage: https://claude.ai/code
  repository: https://github.com/anthropics/claude-code
