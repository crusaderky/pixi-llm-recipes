context:
  # Stable release (Linux — from latest.json)
  version_stable: "0.9.5"
  sha256_stable_x86_64: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
  sha256_stable_aarch64: 17d7536f2da50859523680ef279dffcac8e4a235f4e46fe8da6c2ec44141897c
  # Preview release (Windows — from preview.json; Windows builds are preview-only)
  version_preview: preview-2026-10-14-fbd2ae23927f
  sha256_preview_win_64: e986eb2ba143ad9ad985469b1a1f45a52e113b84fbe0a18623b378528f884f91

package:
  name: herdr
  version: ${{ version_stable }}

build:
  number: 0
  string: h${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    # Extension-less: resolves to build.sh on Linux and build.bat on Windows
    file: build
    env:
      VERSION_STABLE: ${{ version_stable }}
      SHA256_STABLE_X86_64: ${{ sha256_stable_x86_64 }}
      SHA256_STABLE_AARCH64: ${{ sha256_stable_aarch64 }}
      VERSION_PREVIEW: ${{ version_preview }}
      SHA256_PREVIEW_WIN_64: ${{ sha256_preview_win_64 }}

requirements:
  build:
    - curl

about:
  homepage: https://herdr.dev
  repository: https://github.com/herdrdev/herdr
  license: LicenseRef-herdr
  summary: Agent-first terminal multiplexer and coding-agent orchestrator
