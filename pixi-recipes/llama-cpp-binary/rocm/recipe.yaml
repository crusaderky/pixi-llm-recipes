context:
  backend: rocm

package:
  name: llama-cpp
  version: 0

build:
  number: 0
  string: ${{ backend }}_${{ build_number }}
  script:
    file: ../build.sh
    env:
      BACKEND: ${{ backend }}

requirements:
  host:
    - curl

about:
  homepage: https://github.com/ggml-org/llama.cpp
  license: MIT
  license_file: LICENSE
  summary: LLM inference in C/C++
