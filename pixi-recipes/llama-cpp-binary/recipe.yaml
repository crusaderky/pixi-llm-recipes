context:
  # The active backend is selected via the `backend` matrix in variants.yaml
  # and exposed to consumers as a build `flag` (see pixi.toml).
  backend: ${{ backend }}

  # Main branch (upstream llama.cpp)
  # fork: ggml-org/llama.cpp
  # version: b10173
  # asset_prefix: llama

  # beellama.cpp
  fork: Anbeeld/beellama.cpp
  version: v0.4.2
  asset_prefix: beellama

package:
  name: llama-cpp
  version: 0

build:
  number: 0
  string: ${{ backend }}_${{ build_number }}
  script:
    # Extension-less: resolves to build.sh on Linux and build.bat on Windows
    file: build
    env:
      BACKEND: ${{ backend }}
      FORK: ${{ fork }}
      VERSION: ${{ version }}
      ASSET_PREFIX: ${{ asset_prefix }}
  # Expose each backend as a selectable build flag, e.g. `flags = ["vulkan"]`.
  flags:
    - ${{ backend }}
  # `cpu` is the preferred default when no flag is given.
  variant:
    down_prioritize_variant: ${{ 0 if backend == "cpu" else 1 }}
  # Platform gating driven by which release assets beellama publishes:
  # - rocm: linux-64 only (no win, no aarch64)
  # - cuda: linux-64 only (win cuda assets exist upstream but are out of scope;
  #   no aarch64 asset)
  # - vulkan: linux-64 + win-64 only (beellama ships no ubuntu-vulkan-arm64,
  #   unlike mainline)
  skip:
    - if: backend == "rocm"
      then: "win"
    - if: backend == "rocm"
      then: "linux and aarch64"
    - if: backend == "cuda"
      then: "win"
    - if: backend == "cuda"
      then: "linux and aarch64"
    - if: backend == "vulkan"
      then: "linux and aarch64"

requirements:
  build:
    - curl
    - if: linux
      then:
        - patchelf
  run:
    - libgomp
    # CUDA runtime from conda-forge only — never OS-wide CUDA packages.
    # Pinned to CUDA 13.1 to match the upstream `ubuntu-cuda-13.1-x64` asset.
    - if: backend == "cuda"
      then:
        - cuda-version =13.1
        - cuda-cudart
        - libcublas
        - libcurand

about:
  homepage: https://github.com/Anbeeld/beellama.cpp
  license: MIT
  license_file: LICENSE
  summary: LLM inference in C/C++
