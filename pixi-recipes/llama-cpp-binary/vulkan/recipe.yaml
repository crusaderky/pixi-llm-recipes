context:
  backend: vulkan
  version: b9827

package:
  name: llama-cpp
  version: 0

build:
  number: 0
  string: ${{ backend }}_${{ build_number }}
  script:
    # Extension-less: resolves to build.sh on Linux and build.bat on Windows
    file: ../build
    env:
      BACKEND: ${{ backend }}
      VERSION: ${{ version }}

requirements:
  build:
    - curl
    - if: linux
      then:
      - patchelf
  run:
    - libgomp

about:
  homepage: https://github.com/ggml-org/llama.cpp
  license: MIT
  license_file: LICENSE
  summary: LLM inference in C/C++
