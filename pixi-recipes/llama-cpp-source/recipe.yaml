context:
  # Main branch (upstream llama.cpp)
  # fork: ggml-org/llama.cpp
  # version: b10330

  # https://github.com/ggml-org/llama.cpp/pull/21067
  # Forked from main at b8533 (2026-03-26)
  # fork: am17an/llama.cpp
  # version: 4d78c9d1826b9ee4f058a441c8d4ff9c079fd822

  # PR#21067 + merge from master
  # fork: crusaderky/llama.cpp
  # version: b10032-bunch-moe-transfer

  # beellama.cpp — KVarN / KV-cache-precision fork of llama.cpp
  # + Ternary-Bonsai CUDA
  # https://github.com/Anbeeld/beellama.cpp
  # fork: Anbeeld/beellama.cpp
  # version: v0.4.2

  # Beellama-v0.4.2
  # + laguna-S-2.1 cosmetic tweaks
  # + laguna-S-2.1 DFlash
  # + llama-perplexity collision probability measure
  # + fix compilation warnings in the kvarn headers
  # + Nanbeige tool-call fix
  # + pi-llama-cpp context size fix
  fork: crusaderky/llama.cpp
  version: beellama-staging-v0.4.2-r5

  # The active backend is selected via the `backend` matrix in variants.yaml
  # and exposed to consumers as a build `flag` (see pixi.toml).
  backend: ${{ backend }}

  # Semicolon-separated AMDGPU gfx targets to compile device code for. Defaults
  # to this project owner's hardware (Strix Point gfx1150 iGPU; gfx1151 matches
  # the HSA_OVERRIDE_GFX_VERSION=11.5.1 runtime workaround for missing gfx1150
  # rocBLAS kernels). Override for other GPUs (or a broadly-supported arch on CI)
  # with e.g. `LLAMA_GPU_TARGETS=gfx1100 pixi install -e llamacpp-source-rocm`.
  # Only consumed by the rocm backend; harmless for the others.
  gpu_targets: ${{ env.get("LLAMA_GPU_TARGETS", default="gfx1150;gfx1151") }}

  # ccache comes from conda-forge (see requirements.build) — the build never
  # depends on a system-wide ccache install. Its cache directory has to be
  # passed in explicitly: rattler-build points HOME at the throwaway work dir
  # (.pixi/bld/<pkg>/<hash>/work), so a default `$HOME/.cache/ccache` would be
  # discarded together with the build tree and every build would start cold.
  # Defaults to the standard per-user location, which scripts/bwrap-*.sh already
  # bind read-write into the agent sandboxes.
  ccache_dir: ${{ env.get("CCACHE_DIR", default=env.get("HOME") ~ "/.cache/ccache") }}
  # ccache's own 5G default is too small here: one cuda build with
  # GGML_CUDA_FA_ALL_QUANTS=ON is several GiB of objects on its own, so a couple
  # of versions would evict each other.
  ccache_maxsize: ${{ env.get("CCACHE_MAXSIZE", default="20G") }}

package:
  name: llama-cpp
  version: ${{ version }}

source:
  # Use `tag:` (not `rev:`) when `version` is a tag name such as `b9754`;
  # `rev:` expects a commit SHA and rattler-build's git fetch silently leaves
  # an empty working tree when handed a tag, breaking the build.
  git: https://github.com/${{ fork }}
  tag: ${{ version }}
  # rev: ${{ version }}
  patches:
    # conda-forge's default build sysroot is glibc 2.28, and pixi pins it there:
    # `stdlib('c')` resolves to an exact `sysroot_linux-64 =2.28` injected by
    # pixi, which overrides `c_stdlib_version` in a recipe-local variants.yaml,
    # and the `glibc` system requirement in pixi.toml never reaches the build
    # solve. Reproducer: https://github.com/crusaderky/pixi-glibc-version-poc
    #
    # Mainline llama.cpp commit 0cea362 ("vendor: update subprocess.h", #26061,
    # 2026-07-24) updated the vendored sheredom/subprocess.h to implement
    # per-child working directories with posix_spawn_file_actions_addchdir_np(),
    # a glibc 2.29 symbol guarded only for Apple. It reached this fork via merge
    # 8ef0af3 and so is present from beellama-staging-v0.4.2-r1 onwards, where it
    # breaks the build of common/subproc.cpp. The patch makes the call
    # conditional on __GLIBC_PREREQ(2, 29), returning ENOSYS below that; only a
    # server-mcp.cpp config with an explicit "cwd" passes a non-null cwd, and
    # router mode / server-tools pass nullptr, so they are unaffected. Drop this
    # once upstream guards the call itself or the sysroot becomes selectable.
    - patches/0001-subprocess-guard-addchdir-np-on-glibc-lt-2.29.patch

    # Suppress -Wunused-parameter. It fires in bulk from the conda CUDA headers
    # ($PREFIX/targets/x86_64-linux/include/cuda_fp4.hpp), which are included
    # with -I rather than -isystem, and drowns the build log. There is no CMake
    # option for it: the flag comes from `list(APPEND WARNING_FLAGS ... -Wextra
    # ...)` emitted via add_compile_options(), so it lands after CXXFLAGS on the
    # command line and cannot be overridden from the environment -- the negation
    # has to be appended to those same lists. Two of them: cmake/common.cmake
    # (common/src/tools) and ggml/src/CMakeLists.txt (ggml, and ggml-cuda, which
    # forwards CXX_FLAGS into -Xcompiler).
    - patches/0003-cmake-suppress-unused-parameter-warnings.patch

build:
  number: 0
  string: ${{ backend }}_${{ build_number }}
  script:
    file: build.sh
    env:
      BACKEND: ${{ backend }}
      GPU_TARGETS: ${{ gpu_targets }}
      CCACHE_DIR: ${{ ccache_dir }}
      CCACHE_MAXSIZE: ${{ ccache_maxsize }}
  # Expose each backend as a selectable build flag, e.g. `flags = ["cuda"]`.
  flags:
    - ${{ backend }}
  # `cpu` is the preferred default when no flag is given.
  variant:
    down_prioritize_variant: ${{ 0 if backend == "cpu" else 1 }}
  # hipBLAS/rocBLAS and the HIP runtime are not available on conda-forge, so
  # the HIP backend links against the build host's system ROCm install. Those
  # libraries are resolved at runtime via the system linker path (Ubuntu puts
  # them on the default search path) rather than as conda run dependencies, so
  # exempt them from the overlinking / missing-DSO checks. The allowlist only
  # matches ROCm DSOs, so this is a no-op for the other backends; the
  # `overlinking_behavior: ignore` is likewise lenient but harmless for them.
  dynamic_linking:
    overlinking_behavior: ignore
    missing_dso_allowlist:
      - "**/libamdhip64.so*"
      - "**/librocblas.so*"
      - "**/libhipblas.so*"
      - "**/libamd_comgr.so*"
      - "**/libhsa-runtime64.so*"
  # Skip backends that cannot be built on the current platform.
  skip:
    - "win"
    - if: backend == "cuda"
      then: "linux and aarch64"
    - if: backend == "rocm"
      then: "linux and aarch64"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ccache
    - cmake
    - ninja
    - pkg-config
    - if: backend == "cuda"
      then:
        - cuda-nvcc
        - cuda-version =13.1
    - if: backend == "vulkan"
      then:
        - shaderc
  host:
    - libcurl
    - openssl
    - if: backend == "cuda"
      then:
        - cuda-version =13.1
        - cuda-cudart-dev
        - libcublas-dev
        - libcurand-dev
    - if: backend == "vulkan"
      then:
        - libvulkan-headers
        - libvulkan-loader
        - spirv-headers
        - spirv-tools
  run:
    - libcurl
    - if: backend == "cuda"
      then:
        - cuda-cudart
        - libcublas
        - libcurand
    - if: backend == "vulkan"
      then:
        - libvulkan-loader

about:
  homepage: https://github.com/ggml-org/llama.cpp
  license: MIT
  license_file: LICENSE
  summary: LLM inference in C/C++
