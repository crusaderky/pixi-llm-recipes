context:
  # Main branch (upstream llama.cpp)
  # fork: ggml-org/llama.cpp
  # version: b10719

  # beellama.cpp — KVarN / KV-cache-precision fork of llama.cpp
  # https://github.com/Anbeeld/beellama.cpp
  # fork: Anbeeld/beellama.cpp
  # version: v0.4.4

  # Beellama-v0.4.5 preview
  # + llama-perplexity collision probability measure
  # + https://github.com/ggml-org/llama.cpp/pull/21067
  # + https://github.com/ggml-org/llama.cpp/pull/28058 (iGPU KV contamination)
  fork: crusaderky/llama.cpp
  version: beellama-staging-v0.4.5-r2

  # The active backend is selected via the `backend` matrix in variants.yaml
  # and exposed to consumers as a build `flag` (see pixi.toml).
  backend: ${{ backend }}

  # Root of the system ROCm install to build against. ROCm 10 lives in a
  # versioned, self-contained prefix and registers Debian alternatives for
  # /opt/rocm/{bin,lib,...} and /usr/bin/hip*, so a bare `hipconfig` already
  # resolves here — but that is an alternatives *priority*, not a pin; it flips
  # if a second ROCm is installed, and it is registered by the per-arch
  # `amdrocm-core10.0-<gfx>` metapackage alone, so a minimal install (such as
  # CI's) has the versioned prefix and no /opt/rocm/{bin,lib} at all. Name the
  # prefix explicitly so the build is reproducible. Override with e.g.
  # `LLAMA_ROCM_PATH=/usr pixi install -e llamacpp-source-rocm` to build
  # against Ubuntu's archive ROCm 7.1 instead.
  # Only consumed by the rocm backend; harmless for the others.
  rocm_path: ${{ env.get("LLAMA_ROCM_PATH", default="/opt/rocm/core-10.0") }}

  # Semicolon-separated AMDGPU gfx targets to compile device code for. Defaults
  # to Strix Point gfx1150 iGPU. Override for other GPUs (or a broadly-supported
  # arch on CI) with e.g. `LLAMA_GPU_TARGETS=gfx1100 pixi install -e
  # llamacpp-source-rocm`; note that AMD's repo splits device code per
  # architecture, so another target also needs the matching
  # `amdrocm-core10.0-<gfx>` apt package installed. Only consumed by the rocm
  # backend; harmless for the others.
  gpu_targets: ${{ env.get("LLAMA_GPU_TARGETS", default="gfx1150") }}

  # ccache comes from conda-forge (see requirements.build) — the build never
  # depends on a system-wide ccache install. Its cache directory has to be
  # passed in explicitly: rattler-build points HOME at the throwaway work dir
  # (.pixi/bld/<pkg>/<hash>/work), so a default `$HOME/.cache/ccache` would be
  # discarded together with the build tree and every build would start cold.
  # Defaults to the standard per-user location, which scripts/bwrap-*.sh already
  # bind read-write into the agent sandboxes.
  ccache_dir: ${{ env.get("CCACHE_DIR", default=(env.get("HOME", default=env.get("USERPROFILE", default=".")) ~ "/.cache/ccache")) }}
  # ccache's own 5G default is too small here: one cuda build with
  # GGML_CUDA_FA_ALL_QUANTS=ON is several GiB of objects on its own, so a couple
  # of versions would evict each other.
  ccache_maxsize: ${{ env.get("CCACHE_MAXSIZE", default="20G") }}

package:
  name: llama-cpp
  version: ${{ version }}

source:
  # Use `tag:` (not `rev:`) when `version` is a tag name such as `b9754`;
  # `rev:` expects a commit SHA and rattler-build's git fetch silently leaves
  # an empty working tree when handed a tag, breaking the build.
  git: https://github.com/${{ fork }}
  tag: ${{ version }}
  # rev: ${{ version }}
  # branch: ${{ version }}

  patches:
    # Suppress -Wunused-parameter. It fires in bulk from the conda CUDA headers
    # ($PREFIX/targets/x86_64-linux/include/cuda_fp4.hpp), which are included
    # with -I rather than -isystem, and drowns the build log. There is no CMake
    # option for it: the flag comes from `list(APPEND WARNING_FLAGS ... -Wextra
    # ...)` emitted via add_compile_options(), so it lands after CXXFLAGS on the
    # command line and cannot be overridden from the environment -- the negation
    # has to be appended to those same lists. Two of them: cmake/common.cmake
    # (common/src/tools) and ggml/src/CMakeLists.txt (ggml, and ggml-cuda, which
    # forwards CXX_FLAGS into -Xcompiler).
    - patches/0003-cmake-suppress-unused-parameter-warnings.patch

build:
  number: 0
  string: ${{ backend }}_${{ build_number }}
  script:
    file: build.sh
    env:
      BACKEND: ${{ backend }}
      GPU_TARGETS: ${{ gpu_targets }}
      ROCM_PATH: ${{ rocm_path }}
      CCACHE_DIR: ${{ ccache_dir }}
      CCACHE_MAXSIZE: ${{ ccache_maxsize }}
  # Expose each backend as a selectable build flag, e.g. `flags = ["cuda"]`.
  flags:
    - ${{ backend }}
  # `cpu` is the preferred default when no flag is given.
  variant:
    down_prioritize_variant: ${{ 0 if backend == "cpu" else 1 }}
  # hipBLAS/rocBLAS and the HIP runtime are not available on conda-forge, so
  # the HIP backend links against the build host's system ROCm install rather
  # than declaring conda run dependencies — hence the overlinking / missing-DSO
  # exemptions below. The allowlist only matches ROCm DSOs, so this is a no-op
  # for the other backends; the `overlinking_behavior: ignore` is likewise
  # lenient but harmless for them.
  #
  # `rpath_allowlist` is what makes the ROCm 10 layout work. Unlike Ubuntu's
  # archive ROCm 7.1 (which installs under /usr and is on the default linker
  # path), ROCm 10 installs under a private prefix and ships no ld.so.conf.d
  # drop-in, so nothing of it is findable by soname alone. Worse, its
  # libamdhip64 carries the *same* soname as 7.1's — libamdhip64.so.7 — so with
  # both installed a ROCm-10-compiled binary would silently bind to the 7.1
  # runtime instead of failing loudly. build.sh therefore appends
  # ${ROCM_PATH}/lib to CMAKE_INSTALL_RPATH; allowlist it so rattler-build's
  # relocation pass keeps it rather than stripping it as prefix-external.
  dynamic_linking:
    overlinking_behavior: ignore
    missing_dso_allowlist:
      - "**/libamdhip64.so*"
      - "**/librocblas.so*"
      - "**/libhipblas.so*"
      - "**/libamd_comgr.so*"
      - "**/libhsa-runtime64.so*"
    rpath_allowlist:
      - "${{ rocm_path }}/**"
  # Skip backends that cannot be built on the current platform.
  skip:
    - "win"
    - if: backend == "cuda"
      then: "linux and aarch64"
    - if: backend == "rocm"
      then: "linux and aarch64"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ccache
    - cmake
    - ninja
    - pkg-config
    - if: backend == "cuda"
      then:
        - cuda-nvcc
        - cuda-version =13.1
    - if: backend == "vulkan"
      then:
        - shaderc
  host:
    - libcurl
    - openssl
    - if: backend == "cuda"
      then:
        - cuda-version =13.1
        - cuda-cudart-dev
        - libcublas-dev
        - libcurand-dev
    - if: backend == "vulkan"
      then:
        - libvulkan-headers
        - libvulkan-loader
        - spirv-headers
        - spirv-tools
  run:
    - libcurl
    - if: backend == "cuda"
      then:
        - cuda-cudart
        - libcublas
        - libcurand
    - if: backend == "vulkan"
      then:
        - libvulkan-loader

about:
  homepage: https://github.com/ggml-org/llama.cpp
  license: MIT
  license_file: LICENSE
  summary: LLM inference in C/C++
