package:
  name: pi-extensions
  version: "1"

source:
  - path: .

build:
  number: 0
  script:
    # Extension-less: resolves to build.sh on Linux and build.bat on Windows
    file: build
    env:
      # Single source of truth for the plugin pins, consumed by both
      # build.sh and build.bat (space-separated <package>@<version> list).
      PLUGINS: >-
        pi-btw@0.8.1
        pi-caveman@1.0.12
        pi-intercom@0.18.1
        pi-llama-cpp@0.21.0
        pi-web-access@0.47.0
        pi-subagents@0.87.0
        pi-token-speed@0.12.0
        @juicesharp/rpiv-ask-user-question@2.15.0
        @tmustier/pi-usage-extension@0.10.2

requirements:
  build:
    - pi-coding-agent
    - rtk-cli
    - if: linux
      then:
      - patchelf
  run:
    - pi-coding-agent
    - rtk-cli
