package:
  name: pi-extensions
  version: "1"

source:
  - path: .

build:
  number: 0
  script:
    # Extension-less: resolves to build.sh on Linux and build.bat on Windows
    file: build
    env:
      # Single source of truth for the plugin pins, consumed by both
      # build.sh and build.bat (space-separated <package>@<version> list).
      PLUGINS: >-
        pi-autoresearch@1.6.2
        pi-btw@0.4.1
        pi-caveman@1.0.7
        pi-intercom@0.6.0
        pi-llama-cpp@0.9.1
        pi-web-access@0.14.0
        pi-subagents@0.37.0
        pi-token-speed@0.7.1
        @juicesharp/rpiv-ask-user-question@2.1.0
        @tmustier/pi-usage-extension@0.9.4

requirements:
  build:
    - pi-coding-agent
    - rtk-cli
    - if: linux
      then:
      - patchelf
  run:
    - pi-coding-agent
    - rtk-cli
