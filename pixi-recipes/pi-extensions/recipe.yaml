package:
  name: pi-extensions
  version: "2"

source:
  - path: .

build:
  number: 0
  script:
    # Extension-less: resolves to build.sh on Linux and build.bat on Windows
    file: build
    env:
      # Single source of truth for the plugin pins, consumed by both
      # build.sh and build.bat (space-separated full `pi install` sources).
      PLUGINS: >-
        npm:pi-btw@0.8.1
        npm:pi-caveman@1.0.12
        npm:pi-intercom@0.18.1
        npm:pi-llama-cpp@0.22.1
        npm:pi-web-access@0.47.0
        npm:pi-subagents@0.87.0
        npm:pi-token-speed@0.12.0
        npm:@juicesharp/rpiv-ask-user-question@2.15.0
        npm:@tmustier/pi-usage-extension@0.10.2

requirements:
  build:
    - pi-coding-agent
    - rtk-cli
    - if: linux
      then:
      - patchelf
  run:
    - pi-coding-agent
    - rtk-cli
