package:
  name: pi-extensions
  version: "1"

source:
  - path: .

build:
  number: 0
  script:
    # Extension-less: resolves to build.sh on Linux and build.bat on Windows
    file: build
    env:
      # Single source of truth for the plugin pins, consumed by both
      # build.sh and build.bat (space-separated <package>@<version> list).
      # @juicesharp/rpiv-web-tools is excluded: redundant with pi-ollama-cloud.
      PLUGINS: >-
        pi-autoresearch@1.6.0
        pi-btw@0.4.1
        pi-caveman@1.0.7
        pi-llama-cpp@0.7.2
        pi-ollama-cloud@0.6.0
        pi-subagents@0.31.0
        pi-token-speed@0.5.1
        @juicesharp/rpiv-ask-user-question@1.20.0
        @tmustier/pi-usage-extension@0.3.2

requirements:
  host:
    - pi-coding-agent
    - rtk-cli
  run:
    - pi-coding-agent
    - rtk-cli
