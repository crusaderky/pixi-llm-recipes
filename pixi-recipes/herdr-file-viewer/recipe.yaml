context:
  version: "1.13.0"
  # Prebuilt binaries ship from the GitHub release (SHA-256-verified below).
  # Linux aarch64 has no prebuilt upstream (only x86_64-unknown-linux-musl), so
  # this recipe is gated to linux-64 + win-64 in pixi.toml.
  sha256_linux_x86_64: 7f87449a2accb439b0355dd479e8790940453d90d71da1ed79f52702490e6b68
  sha256_win_64: 0128884e3bbc28d66bbe9b1fb3bc73439adc233078812368b3335b314c8b837c

package:
  name: herdr-file-viewer
  version: ${{ version }}

build:
  number: 0
  string: h${{ build_number }}
  dynamic_linking:
    # The upstream Linux prebuilt is a static-pie musl binary. rattler-build's
    # default relocation runs patchelf on every ELF in the prefix, and patchelf
    # corrupts static-pie executables (adds an RPATH + PT_LOAD segment; the
    # result segfaults on startup). Nothing to relocate in a static binary.
    binary_relocation: false
  script:
    # Extension-less: resolves to build.sh on Linux and build.bat on Windows
    file: build
    env:
      VERSION: ${{ version }}
      SHA256_LINUX_X86_64: ${{ sha256_linux_x86_64 }}
      SHA256_WIN_64: ${{ sha256_win_64 }}

requirements:
  build:
    - curl

about:
  homepage: https://github.com/smarzban/herdr-file-viewer
  repository: https://github.com/smarzban/herdr-file-viewer
  license: MIT
  summary: A git-aware, read-only file viewer that lives in a herdr pane