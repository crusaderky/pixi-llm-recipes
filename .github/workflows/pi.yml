name: pi

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  workflow_dispatch: # allows you to trigger manually

# When this workflow is queued, automatically cancel any previous running
# or pending jobs from the same branch
concurrency:
  group: pi-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Every pi step below is bounded on its own; this is the backstop for the
    # rest of the job. A step that wedges must fail in minutes, not at the
    # runner's 6 h limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.84.1
          environments: llamacpp-binary-cpu agents
          cache: true
          locked: true

      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ matrix.os }}

      - name: Start server
        run: pixi r -e llamacpp-binary-cpu start-llamacpp

      - name: pi-unsafe Hello world
        # `-nt` (no tools) because this model is bad at tool calling; prevent it from
        # calling tools if it tries.
        timeout-minutes: 10
        run: pixi r pi-unsafe -- --model LFM2.5-230M -nt -p "Hello world"

      - name: Prepare dummy workspace
        run: mkdir -p ../dummy && touch ../dummy/hello123

      - name: pi-unsafe workspace
        timeout-minutes: 10
        run: |
          pixi r pi-unsafe ../dummy -- --model LFM2.5-230M --tools bash -p "Use bash tool to run ls; return tool output" | tee out.txt
          grep hello123 out.txt

      - name: Global install
        if: matrix.os != 'windows-latest'
        env:
          # CI cannot open a browser for gh's device flow, so install-git.sh
          # skips the interactive `gh auth login` there; this token answers its
          # API calls (`gh auth setup-git`, git identity) instead.
          GH_TOKEN: ${{ github.token }}
        run: pixi r install

      - name: pi Hello world
        if: matrix.os != 'windows-latest'
        timeout-minutes: 10
        run: pixi r pi -- --model LFM2.5-230M -nt -p "Hello world"

      - name: pi workspace
        if: matrix.os != 'windows-latest'
        timeout-minutes: 10
        run: |
          pixi r pi ../dummy -- --model LFM2.5-230M --tools bash -p "Use bash tool to run ls; return tool output" | tee out.txt
          grep hello123 out.txt

      - name: pi Hello world (global start script)
        if: matrix.os != 'windows-latest'
        timeout-minutes: 10
        run: pi --model LFM2.5-230M -nt -p "Hello world"

      - name: pi workspace (global start script)
        if: matrix.os != 'windows-latest'
        working-directory: ../dummy
        timeout-minutes: 10
        run: |
          rm -f out.txt
          pi --model LFM2.5-230M --tools bash -p "Use bash tool to run ls; return tool output" | tee out.txt
          grep hello123 out.txt

      - name: pi --no-git
        if: matrix.os != 'windows-latest'
        working-directory: ../dummy
        timeout-minutes: 10
        run: |
          rm -f out.txt
          pi --model LFM2.5-230M --no-git --tools bash -p "Use bash tool to run ls; return tool output" | tee out.txt
          grep hello123 out.txt

      - name: pi --no-sandbox Hello world (global start script)
        if: matrix.os != 'windows-latest'
        timeout-minutes: 10
        run: pi --no-sandbox --model LFM2.5-230M -nt -p "Hello world"

      - name: pi --no-sandbox workspace + rtk integration (global start script)
        if: matrix.os != 'windows-latest'
        working-directory: ../dummy
        timeout-minutes: 10
        run: |
          rm -f out.txt
          pi --no-sandbox --model LFM2.5-230M --tools bash -p "Use bash tool to run ls; return tool output" | tee out.txt
          grep hello123 out.txt

      - name: Stop server
        run: pixi r stop-llamacpp

      - name: Dump server log
        if: always()
        run: cat llama-server.log
