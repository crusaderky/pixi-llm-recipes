name: pi

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  workflow_dispatch: # allows you to trigger manually

# When this workflow is queued, automatically cancel any previous running
# or pending jobs from the same branch
concurrency:
  group: pi-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.76.1
          environments: llamacpp-binary-cpu agents
          cache: true
          locked: true

      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ matrix.os }}

      - name: Start server
        run: pixi r -e llamacpp-binary-cpu start-server

      - name: pi-unsafe Hello world
        run: pixi r pi-unsafe -- --model LFM2.5-230M -p "Hello world"

      - name: Prepare dummy workspace
        run: mkdir -p ../dummy && touch ../dummy/hello123

      - name: pi-unsafe workspace
        run: |
          pixi r pi-unsafe ../dummy -- --model LFM2.5-230M -p "Use bash tool to run ls; return tool output" | tee out.txt
          grep hello123 out.txt

      - name: Global install
        if: matrix.os != 'windows-latest'
        run: pixi r install

      - name: pi Hello world
        if: matrix.os != 'windows-latest'
        run: pixi r pi -- --model LFM2.5-230M -p "Hello world"

      - name: pi workspace
        if: matrix.os != 'windows-latest'
        run: |
          pixi r pi ../dummy -- --model LFM2.5-230M -p "Use bash tool to run ls; return tool output" | tee out.txt
          grep hello123 out.txt

      - name: pi --with-git --with-herdr Hello world
        if: matrix.os != 'windows-latest'
        run: pixi r pi -- --with-git --with-herdr --model LFM2.5-230M -p "Hello world"

      - name: pi Hello world (global start script)
        if: matrix.os != 'windows-latest'
        run: pi --model LFM2.5-230M -p "Hello world"

      - name: pi workspace (global start script)
        if: matrix.os != 'windows-latest'
        working-directory: ../dummy
        run: |
          pi --model LFM2.5-230M -p "Use bash tool to run ls; return tool output" | tee out.txt
          grep hello123 out.txt

      - name: pi --with-git --with-herdr Hello world (global start script)
        if: matrix.os != 'windows-latest'
        run: pi --with-git --with-herdr --model LFM2.5-230M -p "Hello world"

      - name: pi --no-sandbox Hello world (global start script)
        if: matrix.os != 'windows-latest'
        run: pi --no-sandbox --model LFM2.5-230M -p "Hello world"

      - name: pi --no-sandbox workspace + rtk integration (global start script)
        if: matrix.os != 'windows-latest'
        working-directory: ../dummy
        run: |
          pi --no-sandbox --model LFM2.5-230M -p "Use bash tool to run ls; return tool output" | tee out.txt
          grep hello123 out.txt

      - name: Stop server
        run: pixi r stop-server

      - name: Dump server log
        if: always()
        run: cat llama-server.log
