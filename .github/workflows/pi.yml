name: pi

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  workflow_dispatch: # allows you to trigger manually

# When this workflow is queued, automatically cancel any previous running
# or pending jobs from the same branch
concurrency:
  group: pi-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Every pi step below is bounded on its own; this is the backstop for the
    # rest of the job. A step that wedges must fail in minutes, not at the
    # runner's 6 h limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.84.1
          environments: llamacpp-binary-cpu agents
          cache: true
          locked: true

      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          # llama-server resolves its download cache in this order
          # (common/hf-cache.cpp): LLAMA_CACHE, HF_HUB_CACHE,
          # HUGGINGFACE_HUB_CACHE, $HF_HOME/hub, $XDG_CACHE_HOME/huggingface/hub,
          # then $HOME — %USERPROFILE% on Windows — under .cache/huggingface/hub.
          # So ~ is the right prefix on all three runners, and hub/ is the part
          # that holds the GGUF blobs (the rest is xet state and lock files).
          path: ~/.cache/huggingface/hub
          # The model under test is the `hf =` tag of a [preset] in models.ini, so
          # the key hashes that file. Without the model in the key, switching
          # preset or quant hits the old cache, downloads the new weights into it,
          # and never re-saves (an existing key is never overwritten), so every
          # later run downloads again. restore-keys turns a models.ini edit that
          # does not move the pins into a partial restore rather than a cold start.
          key: hf-hub-${{ matrix.os }}-${{ hashFiles('models.ini') }}
          restore-keys: |
            hf-hub-${{ matrix.os }}-

      - name: Start server
        run: pixi r -e llamacpp-binary-cpu start-llamacpp

      - name: pi-unsafe Hello world
        # `-nt` (no tools) keeps the pure-text steps about the harness: pi
        # reaching the server and finishing a turn with no tool available at all.
        # The workspace steps are what prove tool use.
        timeout-minutes: 10
        run: pixi r pi-unsafe -- --model LFM3-1.7B -nt -p "Hello world"

      - name: Prepare dummy workspace
        run: mkdir -p ../dummy && touch ../dummy/hello123

      - name: pi-unsafe workspace
        timeout-minutes: 10
        run: |
          pixi r pi-unsafe ../dummy -- --model LFM3-1.7B --tools bash -p "Use bash tool to run ls; return tool output" | tee out.txt
          grep hello123 out.txt

      - name: Global install
        if: matrix.os != 'windows-latest'
        env:
          # CI cannot open a browser for gh's device flow, so install-git.sh
          # skips the interactive `gh auth login` there; this token answers its
          # API calls (`gh auth setup-git`, git identity) instead.
          GH_TOKEN: ${{ github.token }}
        run: pixi r install

      - name: pi Hello world
        if: matrix.os != 'windows-latest'
        timeout-minutes: 10
        run: pixi r pi -- --model LFM3-1.7B -nt -p "Hello world"

      - name: pi workspace
        if: matrix.os != 'windows-latest'
        timeout-minutes: 10
        run: |
          pixi r pi ../dummy -- --model LFM3-1.7B --tools bash -p "Use bash tool to run ls; return tool output" | tee out.txt
          grep hello123 out.txt

      - name: pi Hello world (global start script)
        if: matrix.os != 'windows-latest'
        # The wrapper makes your cwd the workspace, so from the repo root these
        # steps feed pi this repo's 46 KB AGENTS.md: 30k prompt tokens, which no
        # model of this size prefills inside the step bound on a CPU-only runner
        # (run 42830109814: task.n_tokens = 30254, still at progress 0.68 after
        # 563 s, with the smaller model it had been using). ../dummy keeps the
        # workspace a real directory without that context, which is what a
        # wrapper step is testing.
        working-directory: ../dummy
        timeout-minutes: 10
        run: pi --model LFM3-1.7B -nt -p "Hello world"

      - name: pi workspace (global start script)
        if: matrix.os != 'windows-latest'
        working-directory: ../dummy
        timeout-minutes: 10
        run: |
          rm -f out.txt
          pi --model LFM3-1.7B --tools bash -p "Use bash tool to run ls; return tool output" | tee out.txt
          grep hello123 out.txt

      - name: pi --no-git
        if: matrix.os != 'windows-latest'
        working-directory: ../dummy
        timeout-minutes: 10
        run: |
          rm -f out.txt
          pi --model LFM3-1.7B --no-git --tools bash -p "Use bash tool to run ls; return tool output" | tee out.txt
          grep hello123 out.txt

      - name: pi --no-sandbox Hello world (global start script)
        if: matrix.os != 'windows-latest'
        # working-directory for the reason given on the other global-script step
        working-directory: ../dummy
        timeout-minutes: 10
        run: pi --no-sandbox --model LFM3-1.7B -nt -p "Hello world"

      - name: pi --no-sandbox workspace + rtk integration (global start script)
        if: matrix.os != 'windows-latest'
        working-directory: ../dummy
        timeout-minutes: 10
        run: |
          rm -f out.txt
          pi --no-sandbox --model LFM3-1.7B --tools bash -p "Use bash tool to run ls; return tool output" | tee out.txt
          grep hello123 out.txt

      - name: Stop server
        run: pixi r stop-llamacpp

      - name: Dump server log
        if: always()
        run: cat llama-server.log
