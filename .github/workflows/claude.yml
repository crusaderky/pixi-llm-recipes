name: claude

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  workflow_dispatch: # allows you to trigger manually

# When this workflow is queued, automatically cancel any previous running
# or pending jobs from the same branch
concurrency:
  group: claude-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.77.0
          environments: agents
          cache: true
          locked: true

      - name: claude-unsafe smoke test
        run: pixi r claude-unsafe -- --version

      - name: Global install
        if: matrix.os != 'windows-latest'
        run: pixi r install

      - name: claude smoke test
        if: matrix.os != 'windows-latest'
        run: pixi r claude -- --version

      - name: claude smoke test (global start script)
        if: matrix.os != 'windows-latest'
        run: claude --version

      - name: claude --no-sandbox smoke test (global start script)
        if: matrix.os != 'windows-latest'
        run: claude --no-sandbox --version
