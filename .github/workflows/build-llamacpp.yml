name: Build llama.cpp

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  workflow_dispatch: # allows you to trigger manually

# When this workflow is queued, automatically cancel any previous running
# or pending jobs from the same branch
concurrency:
  group: build-llamacpp-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # x86-64
          - ubuntu-24.04-arm # ARM
          - windows-latest # x86-64
        backend:
          - cpu
          - vulkan
        include:
          - os: ubuntu-latest
            backend: rocm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.70.2
          environments: llamacpp-binary-${{ matrix.backend }}
          cache: true
          locked: true

      - name: Smoke test
        run: pixi run -e llamacpp-binary-${{ matrix.backend }} llama-version
