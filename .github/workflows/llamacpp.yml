name: llama.cpp

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  workflow_dispatch: # allows you to trigger manually

# When this workflow is queued, automatically cancel any previous running
# or pending jobs from the same branch
concurrency:
  group: llamacpp-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
        backend:
          - source-cpu
          - source-cuda
          - source-vulkan
          - binary-cpu
          - binary-vulkan
        exclude:
          - os: ubuntu-24.04-arm
            backend: source-cuda # FIXME compilation crashes
        include:
          - os: ubuntu-latest
            backend: binary-rocm
          - os: windows-latest
            backend: binary-cpu
          - os: windows-latest
            backend: binary-vulkan

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.71.2
          environments: llamacpp-${{ matrix.backend }} agents
          cache: true
          locked: true

      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ matrix.os }}

      - name: llama-server --version
        run: pixi r -e llamacpp-${{ matrix.backend }} llama-version

      - name: llama-server --list-devices
        run: pixi r -e llamacpp-${{ matrix.backend }} llama-list-devices

      - name: llama-cli Hello world
        run: pixi r -e llamacpp-${{ matrix.backend }} llama-hello

      - name: Start server
        run: pixi r -e llamacpp-${{ matrix.backend }} start-server

      - name: pi Hello world
        run: pixi r pi-unsafe -- --model LFM2.5-230M -p 'Hello world'

      - name: Restart server
        run: pixi r -e llamacpp-${{ matrix.backend }} restart-server

      - name: Seed llama-benchy book cache
        # Avoid the flaky www.gutenberg.org download (intermittent connection
        # timeouts from CI runners) by pre-populating llama-benchy's cache with
        # a bundled public-domain text. The cache is keyed on md5(book-url).
        run: |
          mkdir -p ~/.cache/llama-benchy
          hash=$(printf '%s' "https://www.gutenberg.org/files/1661/1661-0.txt" | md5sum | cut -d' ' -f1)
          cp sample-data/wiki.test.raw ~/.cache/llama-benchy/"$hash".txt

      - name: llama-benchy
        run: pixi r llama-benchy --model LFM2.5-230M --runs 1

      - name: Stop server
        run: pixi r stop-server

      - name: Dump server log
        if: always()
        run: cat llama-server.log
