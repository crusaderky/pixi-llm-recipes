name: llama.cpp

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  workflow_dispatch: # allows you to trigger manually

# When this workflow is queued, automatically cancel any previous running
# or pending jobs from the same branch
concurrency:
  group: llamacpp-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
        backend:
          - source-cpu
          - source-cuda
          - source-vulkan
          - binary-cpu
          - binary-cuda  # beellama only
          - binary-vulkan
          - binary-rocm
        exclude:

          - os: ubuntu-24.04-arm
            backend: binary-vulkan # beellama ships no ubuntu-vulkan-arm64 asset
        include:
          - os: ubuntu-24.04-arm
            backend: source-cpu
          # FIXME compilation crashes            
          # - os: ubuntu-24.04-arm
          #   backend: source-cuda
          - os: ubuntu-24.04-arm
            backend: source-vulkan
          - os: ubuntu-24.04-arm
            backend: binary-cpu
          # no precompiled asset available for DGX Spark
          # - os: ubuntu-24.04-arm
          #   backend: binary-cuda           
          # beellama ships no ubuntu-vulkan-arm64 asset            
          # - os: ubuntu-24.04-arm
          #   backend: binary-vulkan

          - os: ubuntu-26.04  # Need Ubuntu 26.04 for ROCm dependencies
            backend: source-rocm
          - os: windows-latest
            backend: binary-cpu
          - os: windows-latest
            backend: binary-vulkan

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # hipBLAS/rocBLAS and the HIP runtime are not on conda-forge, so the
      # source-rocm variant compiles against the distro's system ROCm. Ubuntu
      # 26.04 ships it in the archive (ROCm 7.1, clang-21) — no third-party AMD
      # apt repo needed. Restrict device codegen to one widely-supported arch to
      # keep the GPU-less CI build fast (inference falls back to CPU anyway).
      - name: Install system ROCm (source-rocm only)
        if: matrix.backend == 'source-rocm'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            hipcc clang-21 libamdhip64-dev librocblas-dev libhipblas-dev rocm-device-libs-21
          echo "LLAMA_GPU_TARGETS=gfx1030" >> "$GITHUB_ENV"

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.73.0
          environments: llamacpp-${{ matrix.backend }} agents
          cache: true
          locked: true

      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ matrix.os }}

      - name: llama-server --version
        run: pixi r -e llamacpp-${{ matrix.backend }} llama-version

      - name: llama-server --list-devices
        run: pixi r -e llamacpp-${{ matrix.backend }} llama-list-devices

      - name: llama-cli Hello world
        run: pixi r -e llamacpp-${{ matrix.backend }} llama-hello

      - name: Start server
        run: pixi r -e llamacpp-${{ matrix.backend }} start-server

      - name: pi Hello world
        run: pixi r pi-unsafe -- --model LFM2.5-230M -p 'Hello world'

      - name: Restart server
        run: pixi r -e llamacpp-${{ matrix.backend }} restart-server

      - name: Seed llama-benchy book cache
        # Avoid the flaky www.gutenberg.org download (intermittent connection
        # timeouts from CI runners) by pre-populating llama-benchy's cache with
        # a bundled public-domain text. The cache is keyed on md5(book-url).
        run: |
          mkdir -p ~/.cache/llama-benchy
          hash=$(printf '%s' "https://www.gutenberg.org/files/1661/1661-0.txt" | md5sum | cut -d' ' -f1)
          cp sample-data/wiki.test.raw ~/.cache/llama-benchy/"$hash".txt

      - name: llama-benchy
        run: pixi r llama-benchy --model LFM2.5-230M --runs 1

      - name: Stop server
        run: pixi r stop-server

      - name: Dump server log
        if: always()
        run: cat llama-server.log
