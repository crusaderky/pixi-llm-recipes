# Strata's command line for this project.
# Run `pixi r strata-help` for live options.
#
# Precedence, highest first: the command line (after `--`), the STRATA_* environment
# (STRATA_FAMILY, STRATA_MODEL, STRATA_VISION, STRATA_CONTEXT, STRATA_VRAM_RESERVE_MIB,
# STRATA_PORT, STRATA_DATA, STRATA_KEEP_MTP_INPUTS), this file. A key repeated here keeps
# its last value.

[strata]
# --------------------------------------------------------------------------
# the model: family = the release, model = its quant. Each quant belongs to
# the families that ship it, and a new pair downloads what it weighs.
# --------------------------------------------------------------------------
# family = qwen       # https://huggingface.co/ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF
# model = Q2_0        # 2-bit, the fastest, 66 GB -- qwen only
# model = IQ2_XS      # 2-bit i-quant, a little better than Q2_0, close in speed, 68 GB
# model = IQ3_XXS
# model = IQ3_S       # 3.5-bit, matches the full model on the published benchmarks, 84 GB

# family = coder      # IQ3_XXS, 50% experts REAPed. ~58 GB
# model = IQ1_M

family = unsloth      # Unsloth's dynamic quants, 1 to 8 bits: the 2026-11-04 (v3.1) 1- to 4-bit files and
#                     # the 2026-09-30 4-bit-and-up ones. There is no UD-IQ1_S: one of its layers mixes two
#                     # expert formats, which Strata cannot load
# model = UD-IQ1_M    # 68 GB, the smallest
# model = UD-Q2_0     # 71 GB
# model = UD-IQ2_XS   # 76 GB
# model = UD-Q2_K_XL  # 80 GB
model = UD-IQ3_XXS    # 84 GB
# model = UD-Q3_K_XL  # 89 GB
# model = UD-IQ4_XS   # 94 GB, the 2026-09-30 file (three shards)
# model = UD-IQ4_XS-v31  # 94 GB, the 2026-11-04 file (four shards, other tensor types)
# model = UD-Q4_K_XL  # 111 GB, needs ~48 GB of RAM at the least
# model = UD-Q5_K_XL  # 158 GB, ~108 GB of RAM
# model = UD-Q6_K_XL  # 169 GB, ~118 GB of RAM
# model = Q8_0        # 188 GB, the reference quality, for a 192 GB PC

# family = gyro       # https://huggingface.co/agentionai/Qwen3.8-Flash-Next-Gyro-GGUF
# model = Gyro-S      # 58.5 GB download, 27.6 GB RAM
# model = Gyro-M      # 92 GB, 35 GB RAM, about IQ3_XXS quality with ~20% less GPU memory

# family = swift      # UkisAI's Swift 1.5 fine-tune: much shorter thinking.
#                     # issue #171: Q2_0 is unsupported as it splits the experts of a layer
#                     # over two shards
# model = IQ2_XS
# model = IQ3_XXS
# model = IQ3_S

# family = nvfp4      # NVFP4 packs by sergqwer: ready-made Strata packs, not GGUFs. setup.py
#                     # prepares those itself, and this wrapper has no path for them (it fetches
#                     # the GGUF shards into the Hub cache and hands over --gguf-dir).

# family = qwen36     # new in 0.1.44: Qwen3.6-35B-A3B (35B MoE, 3B active: 256 experts, top-8).
#                     # Its own engine path: the GGUF is read as it is -- no pack, no expert
#                     # profile, no MTP fetch, the file's own MTP block drafts (setup.py writes
#                     # `--mtp 2` into the run config). CUDA/HIP builds only. It reads pictures
#                     # through its own mmproj since 0.2, so `vision` applies to it as usual.
# model = UD-Q4_K_XL  # 22.9 GB,, ~32 GB of RAM
# model = UD-Q6_K_XL  # 32.6 GB, ~44 GB RAM
# model = Q8_0        # 37.8 GB, ~52 GB RAM

# --------------------------------------------------------------------------
# context and KV cache
# --------------------------------------------------------------------------
# 262144 is the model's trained window (256K), so no rope scaling is involved. Past it,
# setup.py adds yarn and derives --rope-scale from the final context itself.
context = 262144
# context = 393216    # 384K: rope scaling, rope-scale 1.5
# rope-scaling = yarn # none is refused past the trained 262144
# rope-scale = 1.5
# kv = int8           # the default above 8K context
# kv = q4_0           # half the memory, a little less precise
# kv = k8v4           # INT8 K + 4-bit V, 816 B/cell
# kv = fp16           # twice int8's memory, the reference precision
# kv-streaming = auto # from a 64K context: the KV cache in RAM, only the window in VRAM
# parallel = 1        # up to N requests decode together instead of one at a time.

# --------------------------------------------------------------------------
# VRAM and RAM
# --------------------------------------------------------------------------
# The engine's own default is 700 MiB, and on a card that also drives the display that is
# too little: the expert cache (and the image encoder, on vision = gpu) takes the rest, the
# desktop's buffers are evicted and the X server goes down mid-reply. 2048 is ~1.3 GB back
# from the expert cache, a few percent of speed; upstream's advice for the same failure is
# 3072 (Strata #560, #516).
vram-reserve-mib = 2048
# low-ram = auto      # read the experts from the GGUF instead of copying them all into RAM
#                     # (auto: when they would not fit), or force one of the two modes:
# low-ram = resident  # resident copies them into RAM once, mmap reads them through the OS cache
# resident-budget-gib = 32   # UD-Q4_K_XL / UD-IQ4_XS / the bigger Unsloth files: the GiB of
#                     # experts kept in RAM

# --------------------------------------------------------------------------
# images
# --------------------------------------------------------------------------
vision = gpu          # the image encoder on the GPU, 1024 image tokens by default
# vision = yes        # setup's own choice for this card: the CPU reader under 24 GB of VRAM
# vision = cpu        # 300 image tokens, no VRAM
# vision = no
# vision-tokens = 2048   # more reads small text and charts better, and encodes slower

# --------------------------------------------------------------------------
# the drafter: DFlash2 or the model's own MTP head
# --------------------------------------------------------------------------
drafter = dflash2        # Qwen3.8-Flash-Next (all variants) on CUDA, HIP, Metal or SYCL.
# drafter = mtp          # All other models/engines
# drafter = off          # ~1 GB of VRAM back for the expert cache
# draft-vocab = en       # the draft head's tokens, DFlash2's as well as the MTP's: English
#                        # and code only, ~110 MiB less VRAM, 1-2% faster answers
# draft-vocab = cyrillic # Ukrainian/Russian answers decode ~30% faster
# draft-vocab = fr       # French answers: 18% more drafts accepted
# keep-mtp-inputs =      # this wrapper's own: keep the MTP layer's ~5.8 GB of build inputs

# --------------------------------------------------------------------------
# GPUs
# --------------------------------------------------------------------------
# gpu = 0             # one card, numbered as nvidia-smi numbers them
# gpus = 0,1          # several cards sharing one model (docs/MULTI_GPU.md)
# gpu-roles = 1=main,0=helper   # a role per card instead of gpu(s): main, helper or off
# layer-split = 32    # with gpus: where each later card's layers start
# no-remote-expert-opt =   # leave out --remote-expert-opt, which setup adds with 2+ cards
# backend = hip       # AMD (Linux: compiled by the recipe, which needs its own build)
# cuda = 12           # the experimental CUDA 12 engine for Pascal / Volta cards

# --------------------------------------------------------------------------
# the server
# --------------------------------------------------------------------------
# 8082 keeps clear of llama-server (9931, which forge also fronts) and the
# forge-guardrails proxy (8080).
port = 8082
# host = 0.0.0.0      # allow other devices on the network to connect; set api-key too
# api-key = secret
no-browser =          # never opens the chat page: these tasks start the server in the background
# browser =           # the opposite, for a start from a terminal
yes =                 # accept setup.py's recommended answers: without it a background start
#                     # has no terminal to answer its questions with

# ------------------------
# where things are written
# ------------------------
# data-dir = /path/to/strata-data    # default $CONDA_PREFIX/strata-data: packs, MTP layer

# --------------------------------------------------------------------------
# everything else setup.py takes
# --------------------------------------------------------------------------
# experimental-speed-projection = on   # EXPERIMENTAL, off by default
# build =                     # compile the engine instead of the ready-made one
# prebuilt = <url or folder>  # where the ready-made engine is
