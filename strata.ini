# Strata's command line for this project.
#
# Every key below becomes an argument for Strata's own setup.py, exactly as
# `pixi run start-strata -- --<key> <value>` would pass it. `pixi run strata-help` prints
# the whole flag list with setup.py's own explanation of each one.
#
# Precedence, highest first: the command line (after `--`), the STRATA_* environment
# (STRATA_FAMILY, STRATA_MODEL, STRATA_VISION, STRATA_CONTEXT, STRATA_VRAM_RESERVE_MIB,
# STRATA_PORT, STRATA_DATA, STRATA_KEEP_MTP_INPUTS), this file. A key repeated here keeps
# its last value.
#
# Syntax: `key = value`. Dashes or underscores, the leading `--` optional. A key with no
# value is a flag on its own (`no-browser =`); writing `off`, `no` or `false` drops one, so
# a default flag can be turned off without deleting its line. Comments need whitespace
# before them, so an api key containing `#` keeps it.
#
# Which half of setup.py reads a key matters. `port`, `gpu`, `gpus`, `layer-split`, `host`,
# `api-key`, `draft-vocab`, `vram-reserve-mib`, `no-browser` and `yes` apply to every start.
# The rest are read only when the model is prepared: change one here and the next start
# re-prepares the model (~2 min, no download) instead of serving the value the run config
# already holds. `pixi run strata-install` re-prepares whatever the current file says.
#
# `setup`, `no-start`, `update`, `check` and `calibrate` are one-shot commands, not
# settings: they are refused here because they would run on every start. Give them on the
# command line (`pixi run strata-install -- --calibrate`). `gguf-dir` is the wrapper's own
# (the symlinks into ~/.cache/huggingface/hub) and cannot be set here either.

[strata]
# --------------------------------------------------------------------------
# the model: family = the release, model = its quant. Each quant belongs to
# the families that ship it, and a new pair downloads what it weighs.
# --------------------------------------------------------------------------
family = qwen
model = IQ3_XXS
# family = coder      # the Coder: half the experts, IQ1_M is its only size, ~58 GB
# family = swift      # UkisAI's Swift 1.5 fine-tune: much shorter thinking
# family = unsloth    # Unsloth's ~4-bit quants
# model = IQ2_XS      # 2-bit i-quant, a little better than Q2_0, close in speed, 68 GB
# model = IQ3_S       # 3.5-bit, matches the full model on the published benchmarks, 84 GB
# model = Q2_0        # 2-bit, the fastest, 66 GB
# model = IQ1_M       # with family = coder: 58 GB, needs ~32 GB of RAM
# model = UD-IQ4_XS   # with family = unsloth: 94 GB, between IQ3_S and UD-Q4_K_XL
# model = UD-Q4_K_XL  # with family = unsloth: 111 GB, EXPERIMENTAL

# --------------------------------------------------------------------------
# context and KV cache
# --------------------------------------------------------------------------
# 262144 is the model's trained window (256K), so no rope scaling is involved. Past it,
# setup.py adds yarn and derives --rope-scale from the final context itself.
context = 262144
# context = 393216    # 384K: rope scaling, rope-scale 1.5
# rope-scaling = yarn # none is refused past the trained 262144
# rope-scale = 1.5
# kv = int8           # the default above 8K context
# kv = q4_0           # half the memory, a little less precise
# kv = k8v4           # INT8 K + 4-bit V, 816 B/cell
# kv-streaming = auto # from a 64K context: the KV cache in RAM, only the window in VRAM
# parallel = 1        # up to N requests decoding together; each slot takes expert cache

# --------------------------------------------------------------------------
# VRAM and RAM
# --------------------------------------------------------------------------
# The engine's own default is 700 MiB, and on a card that also drives the display that is
# too little: the expert cache (and the image encoder, on vision = gpu) takes the rest, the
# desktop's buffers are evicted and the X server goes down mid-reply. 2048 is ~1.3 GB back
# from the expert cache, a few percent of speed; upstream's advice for the same failure is
# 3072 (Strata #560, #516).
vram-reserve-mib = 2048
# low-ram = auto      # read the experts from the GGUF instead of copying them all into RAM
# resident-budget-gib = 32   # UD-Q4_K_XL / UD-IQ4_XS: the GiB of experts kept in RAM

# --------------------------------------------------------------------------
# images
# --------------------------------------------------------------------------
vision = gpu          # the image encoder on the GPU, 1024 image tokens by default
# vision = cpu        # 300 image tokens, no VRAM
# vision = no
# vision-tokens = 2048   # more reads small text and charts better, and encodes slower

# --------------------------------------------------------------------------
# the draft (MTP) head
# --------------------------------------------------------------------------
# draft-vocab = en       # English and code only: ~110 MiB less VRAM, 1-2% faster answers
# draft-vocab = cyrillic # Ukrainian/Russian answers decode ~30% faster
# draft-vocab = fr       # French answers: 18% more drafts accepted
# keep-mtp-inputs =      # this wrapper's own: keep the MTP layer's ~5.8 GB of build inputs

# --------------------------------------------------------------------------
# GPUs
# --------------------------------------------------------------------------
# gpu = 0             # one card, numbered as nvidia-smi numbers them
# gpus = 0,1          # several cards sharing one model (docs/MULTI_GPU.md)
# layer-split = 32    # with gpus: where each later card's layers start
# no-remote-expert-opt =   # leave out --remote-expert-opt, which setup adds with 2+ cards
# backend = hip       # AMD (Linux: compiled by the recipe, which needs its own build)
# cuda = 12           # the experimental CUDA 12 engine for Pascal / Volta cards

# --------------------------------------------------------------------------
# the server
# --------------------------------------------------------------------------
# 8082 keeps clear of llama-server (8080) and forge-guardrails (8081).
port = 8082
# host = 0.0.0.0      # allow other devices on the network to connect; set api-key too
# api-key = secret
no-browser =          # never opens the chat page: these tasks start the server in the background
# browser =           # the opposite, for a start from a terminal
yes =                 # accept setup.py's recommended answers: without it a background start
#                     # has no terminal to answer its questions with

# ------------------------
# where things are written
# ------------------------
# data-dir = /path/to/strata-data    # default $CONDA_PREFIX/strata-data: packs, MTP layer

# --------------------------------------------------------------------------
# everything else setup.py takes
# --------------------------------------------------------------------------
# experimental-speed-projection = on   # EXPERIMENTAL, off by default
# build =                     # compile the engine instead of the ready-made one
# prebuilt = <url or folder>  # where the ready-made engine is
