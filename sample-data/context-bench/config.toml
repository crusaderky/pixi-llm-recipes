# Example config for run_benchmark.py
#
#   pixi run context-bench sample-data/context-bench/config.toml -o results.toml
#
# Each table is one "model tag". Only `ctx-size` is required: it lists the
# books to evaluate, each matching an available book (16k, 32k, 64k, 128k, 256k).
# `url` defaults to http://localhost:8080/v1 (the project's llama-server).
#
# Apply defaults to all models; can override per-model below
["*"]
url = "http://localhost:8080/v1"

# It's a bad idea to set temperature = 0 - see README.md.
# temperature = 0.3

# Pin the sampling seed for reproducible runs (passed per-request, no server
# restart needed). Holding the seed fixed across e.g. a q8/q8 vs q4/q4 paired
# comparison isolates the cache-quantization effect from sampling noise.
# Default (commented out): the server picks a random seed per request.
# Note: a fixed seed makes sampling reproducible given identical logits, but
# GPU/floating-point non-determinism still leaves some residual variance.
# seed = 42

# Hard limit on total decode tokens (reasoning + output).
# Must be higher than the server-side setting `reasoning-budget = 8192`.
max_tokens = 9000

[Gemma4-E2B]
ctx-size = ["16k", "32k", "64k", "128k"]

[Gemma4-E4B]
ctx-size = ["16k", "32k", "64k", "128k"]

[Gemma4-12B]
# Note: increasing context beyond 32k requires a change in models.ini
# ctx-size = ["16k", "32k"]
ctx-size = ["16k", "32k", "64k", "128k", "256k"]

[Gemma4-26B-A4B]
ctx-size = ["16k", "32k", "64k", "128k", "256k"]

["Qwen3.6-35B-A3B"]
ctx-size = ["16k", "32k", "64k", "128k", "256k"]

# Arbitrary OpenAI-compatible endpoint
# [some-cloud-model]
# url = "https://api.example.com/v1"
# api_key = "xxxxxxx"
# api_key_env = "MY_API_KEY"  # Mutually exclusive with api_key
# model_name = "provider/model-256k"
# ctx-size = ["16k", "32k", "64k", "128k", "256k"]
# temperature = 0.0
# max_tokens = 2048
# timeout = 1800
