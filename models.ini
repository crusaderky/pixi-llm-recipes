[Gemma4-E2B]
# Note: UD-Q2_K_XL has the same accuracy and is smaller, but is much slower
hf = unsloth/gemma-4-E2B-it-qat-GGUF:UD-Q4_K_XL
ctx-size = 131072
ngl = 99

temperature = 1.0
top-p = 0.95
top-k = 64
# min-p=0.01 trims the unreliable tail (Gemma tolerates up to 0.01 with no quality loss)
min-p = 0.01
; chat-template-kwargs = {"enable_thinking":false}

# Break degenerate repetition loops in the inner monologue. Google/Unsloth recommend
# repeat-penalty=1.0 (i.e. disabled), so rely on the DRY sampler instead: it kills
# verbatim loops without penalising legitimate token reuse.
# https://unsloth.ai/docs/models/gemma-4
dry-multiplier = 0.8
dry-base = 1.75
dry-allowed-length = 2
dry-penalty-last-n = -1

# MTP drafter
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-ngl = 99

[Gemma4-E4B]
# Note: UD-Q2_K_XL has the same accuracy and is smaller, but is much slower
# For various tweaks, read comments in Gemma4-E2B
hf = unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL
ctx-size = 65536
# 128k unquantized V-cache doesn't fit
# V-cache quantization is incompatible with MTP (see below)
; ctx-size = 131072
ngl = 99

temperature = 1.0
top-p = 0.95
top-k = 64
min-p = 0.01
; chat-template-kwargs = {"enable_thinking":false}

dry-multiplier = 0.8
dry-base = 1.75
dry-allowed-length = 2
dry-penalty-last-n = -1

# MTP drafter
# FIXME doesn't support FA, which in turn is needed for quantized KV cache
# https://huggingface.co/unsloth/gemma-4-E4B-it-qat-GGUF/blob/main/MTP/README.md
flash-attn = off
cache-type-k = f16
cache-type-v = f16
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-ngl = 99

