version = 1

[*]
jinja = true
# Increase log-verbosity to 5 to see the raw RPC chatter between server and harness
log-verbosity = 4
flash-attn = on

# Setting informed by https://github.com/ggml-org/llama.cpp/pull/7412#issuecomment-2120427347
# TODO: Change to Turboquant once merged into llama.cpp main branch
cache-type-k = q8_0
cache-type-v = q8_0
# Almost half the size and the degradation from q8_0 is not measurable with
# llama-perplexity, but the whole internet says they're terrible?!?
; cache-type-k = q4_0
; cache-type-v = q4_0

# Max prompt cache in host RAM
# Note that llama-benchy --no-cache ignores it
; cache-ram = 8192

[Qwen3.6-35B-A3B]
# The best quality model that is performant on less
# than 24 GiB VRAM, as of 2026-06-15
hf = byteshape/Qwen3.6-35B-A3B-MTP-GGUF:Qwen3.6-35B-A3B-IQ4_XS-3.97bpw

# Choose a context size
; ctx-size = 131072  # 128k recommended on 8 GiB VRAM
ctx-size = 262144  # 256k recommended on 10 GiB+ VRAM

# Never touch ngl or speed will drop drastically
ngl = 99
# Progressively reduce n-cpu-moe from 40 to 0 until you get memory errors
# (the smaller the ctx-size the more experts you can offload to GPU)
n-cpu-moe = 40

# Alternatively, try an automatic fit by commenting out ngl and n-cpu-moe above and
# uncomment fit-target below. Increase fit-target if llama.cpp crashes with
# out-of-memory errors.
; fit-target = 0
# Look for these lines in the log file:
# [49325] 0.06.892.992 I common_params_fit_impl:   - CUDA0 (NVIDIA GeForce RTX 3080): 42 layers (40 overflowing),   6208 MiB used,    918 MiB free
# [49325] 0.17.069.257 I load_tensors: offloaded 42/42 layers to GPU

# Uncomment if your workflow is very varied in domain - which will increase the number
# of experts active at once. For coding on a single project, mmap is a lot less host
# RAM-intensive and may be slightly faster on CUDA. On Vulkan, no-mmap gives a 50% speed
# boost to input tokens! YMMV. Test with llama-benchy and don't forget that a warm
# server is faster than a cold one.
; no-mmap = true

# Suppress Qwen-specific warning
image-min-tokens = 1024  

# MTP drafter
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-ngl = 99

# Comment out to move mmproj to VRAM for faster image analysis
no-mmproj-offload = true

# Prevent infinite loops in the inner monologue
# https://whamp.github.io/blog/qwen-3-6-27b-livecodebench-reasoning-budget/
reasoning-budget = 8192
reasoning-budget-message = "My reasoning budget is exhausted, but I have enough information to answer directly now.</think>"

chat-template-file = chat-templates/qwen3.6-froggeric-v20.jinja

# Choose one set of parameters depending on usage
# From https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF

# Thinking mode for general tasks
; temperature = 1.0
; top_p = 0.95
; top_k = 20
; min_p = 0.0
; presence_penalty = 1.5
; repeat_penalty = 1.0

# preserve_thinking makes the context baloon and is harmful when the KV cache is
# quantized. However, it speeds up multi-step agentic loops thanks to the KV cache.
# See https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates#token-saving-stripping-past-thoughts
# NOTE: the chat template defaults to false.
; chat-template-kwargs = {"preserve_thinking":true}

# Thinking mode for precise coding tasks 
temperature = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
# See comment in above paragraph
chat-template-kwargs = {"preserve_thinking":true}

# Instruct (or non-thinking) mode for general tasks
; temperature = 0.7
; top-p = 0.8
; top-k = 20
; min-p = 0.0
; presence-penalty = 1.5
; repeat-penalty = 1.0
; chat-template-kwargs = {"enable_thinking":false}

# Instruct (or non-thinking) mode for reasoning tasks
; temperature = 1.0
; top-p = 0.95
; top-k = 20
; min-p = 0.0
; presence-penalty = 1.5
; repeat-penalty = 1.0
; chat-template-kwargs = {"enable_thinking":false}

[Qwen3.6-27B]
hf = unsloth/Qwen3.6-27B-MTP-GGUF:Q4_K_M

