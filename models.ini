spec-draft-ngl = 99
spec-draft-n-max = 3

# no-mmproj-offload = true  # Keep vision tower in host RAM (-852 MiB VRAM)
# no-mmproj = true  # Disable vision entirely to save RAM
image-min-tokens = 1024

# Thinking mode
temperature = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

