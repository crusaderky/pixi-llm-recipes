version = 1

[*]
jinja = true
log-colors = on
log-verbosity = 4
flash-attn = on
models-max = 1

# Setting informed by https://github.com/ggml-org/llama.cpp/pull/7412#issuecomment-2120427347
# TODO: Change to Turboquant once merged into llama.cpp main branch
cache-type-k = q8_0
cache-type-v = q8_0
# Almost half the size and the degradation from q8_0 is not measurable with
# llama-perplexity, but the whole internet says they're terrible?!?
; cache-type-k = q4_0
; cache-type-v = q4_0

[Qwen3.6-35B-A3B]
# The best quality model that is performant on less
# than 24 GiB VRAM, as of 2026-06-04
# 17.6 GiB, 98.71% accuracy, 53±3 tok/s
hf = byteshape/Qwen3.6-35B-A3B-MTP-GGUF:Qwen3.6-35B-A3B-IQ4_XS-3.97bpw

; ctx-size = 131072  # 128k recommended on 8 GiB VRAM
ctx-size = 262144  # 256k recommended on 10 GiB+ VRAM

# Increase this if llama.cpp crashes with out-of-memory errors
fit-target = 0
# Alternatively, go manual.
# Never touch ngl; progressively reduce n-cpu-moe from 40 to 0 until you get memory errors
; ngl = 99
; n-cpu-moe = 40
# Look for these lines in the log file:
# [49325] 0.06.892.992 I common_params_fit_impl:   - CUDA0 (NVIDIA GeForce RTX 3080): 42 layers (40 overflowing),   6208 MiB used,    918 MiB free
# [49325] 0.17.069.257 I load_tensors: offloaded 42/42 layers to GPU

image-min-tokens = 1024
spec-type = draft-mtp
spec-draft-n-max = 3
no-mmap = true
# Comment out to move mmproj to VRAM for faster image analysis
no-mmproj-offload = true

# Prevent infinite loops in the inner monologue
# https://whamp.github.io/blog/qwen-3-6-27b-livecodebench-reasoning-budget/
reasoning-budget = 8192
reasoning-budget-message = "My reasoning budget is exhausted, but I have enough information to answer directly now.</think>"

# Choose one set of parameters depending on usage
# From https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF

# Thinking mode for general tasks
; temperature = 1.0
; top_p = 0.95
; top_k = 20
; min_p = 0.0
; presence_penalty = 1.5
; repeat_penalty = 1.0

# Thinking mode for precise coding tasks 
temperature = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

# Instruct (or non-thinking) mode for general tasks
; temperature = 0.7
; top-p = 0.8
; top-k = 20
; min-p = 0.0
; presence-penalty = 1.5
; repeat-penalty = 1.0

# Instruct (or non-thinking) mode for reasoning tasks
; temperature = 1.0
; top-p = 0.95
; top-k = 20
; min-p = 0.0
; presence-penalty = 1.5
; repeat-penalty = 1.0

[MiniCPM5-1B]
# 0.7 GiB, 455±37 tok/s
# FIXME Tool use not compatible with llamacpp
# https://github.com/ggml-org/llama.cpp/pull/23802
hf = openbmb/MiniCPM5-1B-GGUF:Q4_K_M
ctx-size = 131072
ngl = 99

# Think
reasoning = on
temperature = 0.9
top-p = 0.95

# No Think
; reasoning = off
; temperature = 0.7
; top-p = 0.95

[Gemma4-E2B]
# 3.5 GiB, 198±1 tok/s 
hf = HauhauCS/Gemma-4-E2B-Uncensored-HauhauCS-Aggressive:Q4_K_P
ctx-size = 131072
ngl = 99
temperature = 1.0
top-p = 0.95
top-k = 64

[Gemma4-E4B]
# 5.5 GiB, 130±3 tok/s 
hf = HauhauCS/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive:Q4_K_P
ctx-size = 131072
ngl = 99
temperature = 1.0
top-p = 0.95
top-k = 64

[Gemma4-12B]
# 6.4 GiB, 72±2 tok/s 
hf = unsloth/gemma-4-12b-it-GGUF:IQ4_XS
ngl = 99

# Comment out to move mmproj to VRAM for faster image analysis
no-mmproj-offload = true

ctx-size = 65536
; ctx-size = 131072
; ctx-size = 262144

temperature = 1.0
top-p = 0.95
top-k = 64
; chat-template-kwargs = {"enable_thinking":false}

