version = 1

[*]
jinja = true
# Increase log-verbosity to 5 to see the raw RPC chatter between server and harness
log-verbosity = 4
flash-attn = on

# q8/q8 is a safe default KV cache quantization with very
# little degradation across all models.
cache-type-k = q8_0
cache-type-v = q8_0

# Max prompt cache in host RAM
# Note that llama-benchy --no-cache ignores it
; cache-ram = 8192

# These two flags are needed to get a massive boost to prefill speed, as they
# allow skipping an intermediate copy unpinned host RAM -> pinned host RAM ->
# VRAM when the expert tensors are copied to VRAM. Uncomment both to enable
# page-faulting unused experts to disk, with much reduced host RAM usage.
#
# Linux note: mlock needs a high locked-memory limit. The stock `ulimit -l` can
# be as low as 8 MiB, which is far too small for multi-GiB models, which may
# cause models to fail loading. `pixi run install` (or `pixi run
# install-memlock`) raises it to unlimited; log out and back in for it to take
# effect.
mlock = true
no-mmap = true

# https://github.com/ggml-org/llama.cpp/pull/21067
# Need change to pixi-recipes/llama-cpp-source/recipe.yaml
# Prefetch all experts for a layer instead of blocking after gate activation and
# fetching only the needed tensors.
# Only has effect on models with spilled experts.
# Requires a lot more scratch VRAM.
; ub = 2048
; prefetch-weights = 1

# Prevent infinite loops in the inner monologue: cap the thinking tokens and, when the
# cap is hit, force a graceful stop with `reasoning-budget-message`.
# https://whamp.github.io/blog/qwen-3-6-27b-livecodebench-reasoning-budget/
# Note: llama.cpp appends the model's own end-of-thinking tag to the message
# automatically (</think> for Qwen, <channel|> for Gemma 4 — see common/chat.cpp and
# tools/server/server-task.cpp `message + end_tag`). The message must therefore be plain
# prose with NO closing tag.
reasoning-budget = 8192
reasoning-budget-message = "My reasoning budget is exhausted, but I have enough information to answer directly now."

[Qwen3.6-35B-A3B]
# The best quality model that is performant on less
# than 24 GiB VRAM, as of 2026-06-15
hf = byteshape/Qwen3.6-35B-A3B-MTP-GGUF:Qwen3.6-35B-A3B-IQ4_XS-3.97bpw

# kvarn5 t1024 is almost lossless
# https://www.reddit.com/r/LocalLLaMA/comments/1v0xjw6/beellamacpp_v040_kvarn_kv_precision_tail_q2_0q3_1/
ctx-size = 262144
cache-type-k = kvarn5
cache-type-v = kvarn5
kv-tail-tokens = 1024

# Never touch ngl or speed will drop drastically
ngl = 99
# Progressively reduce n-cpu-moe from 40 to 0 until you get memory errors
# (the smaller the ctx-size the more experts you can offload to GPU)
# Expect fairly small performance gains from this though.
n-cpu-moe = 40

# Alternatively, try an automatic fit by commenting out ngl and n-cpu-moe above and
# uncomment fit-target below. Increase fit-target if llama.cpp crashes with
# out-of-memory errors. This is NOT recommended, as it will likely cause youur
# performance to drop unexpectedly if for any reason llamacpp decides not to fit all
# dense tensors into VRAM.
; fit-target = 0
# Look for these lines in the log file:
# [49325] 0.06.892.992 I common_params_fit_impl:   - CUDA0 (NVIDIA GeForce RTX 3080): 42 layers (40 overflowing),   6208 MiB used,    918 MiB free
# [49325] 0.17.069.257 I load_tensors: offloaded 42/42 layers to GPU

# Suppress Qwen-specific warning
image-min-tokens = 1024  

# MTP drafter
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-ngl = 99

# Use these instead to get an extra ~4 tok/s -
# but at the cost of 1GB extra VRAM.
; spec-draft-n-max = 7
; spec-draft-p-min = 0.75

# Comment out to move mmproj to VRAM for faster image analysis
no-mmproj-offload = true

chat-template-file = chat-templates/qwen3.6-froggeric.jinja

# Choose one set of parameters depending on usage
# From https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF

# Thinking mode for general tasks
; temperature = 1.0
; top-p = 0.95
; top-k = 20
; min-p = 0.0
; presence-penalty = 1.5
; repeat-penalty = 1.0

# preserve_thinking makes the context balloon and is harmful when the KV cache is
# quantized. However, it speeds up multi-step agentic loops thanks to the KV cache.
# See https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates#token-saving-stripping-past-thoughts
# NOTE: the chat template defaults to true.
; chat-template-kwargs = {"preserve_thinking":false}

# Thinking mode for precise coding tasks 
temperature = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
# See comment in above paragraph
; chat-template-kwargs = {"preserve_thinking":false}

# Instruct (or non-thinking) mode
; temperature = 0.7
; top-p = 0.80
; top-k = 20
; min-p = 0.0
; presence-penalty = 1.5
; repeat-penalty = 1.0
; reasoning = off

