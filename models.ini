version = 1

[*]
jinja = true
# Increase log-verbosity to 5 to see the raw RPC chatter between server and harness
log-verbosity = 4
flash-attn = on

# Reduce max parallel connections from 4 to 1; saves ~800 MiB RAM on larger models
parallel = 1
kv-unified = true

# Max prompt cache in host RAM, in MiB
# Note that llama-benchy --no-cache ignores it
; cache-ram = 8192
# A handful checkpoints is plenty for mid-context rollback.
ctx-checkpoints = 4

# Not putting all layers on GPU guarantees that the model will run glacially.
# Never do it. If you're out of VRAM, push (more) experts to CPU instead with
# n-cpu-moe = 99. If you're desperate, push the ffn tensors to CPU with
# ot = blk\.[0-9]+\.ffn_.*=CPU
n-gpu-layers = 99

# Prevent infinite loops in the inner monologue: cap the thinking tokens and, when the
# cap is hit, force a graceful stop with `reasoning-budget-message`.
# https://whamp.github.io/blog/qwen-3-6-27b-livecodebench-reasoning-budget/
# Note: llama.cpp appends the model's own end-of-thinking tag to the message
# automatically (</think> for Qwen, <channel|> for Gemma 4 — see common/chat.cpp and
# tools/server/server-task.cpp `message + end_tag`). The message must therefore be plain
# prose with NO closing tag.
reasoning-budget = 8192
reasoning-budget-message = "My reasoning budget is exhausted, but I have enough information to answer directly now."

# Only show the alias
dedup-cache-models = true

[Qwen3.8-Flash]
hf = unsloth/Qwen3.8-Flash-Next-GGUF:UD-IQ3_XXS

cpu-moe = true
moe-cache-mib = 12700
moe-cache-cpu-share = 0.2
load-mode = mmap  # Keep n-grams on disk

ctx-size = 262144
cache-type-k = q5_0
cache-type-v = q4_0

; no-mmproj-offload = true  # Keep vision tower in host RAM
; no-mmproj = true  # Disable vision entirely to save RAM
image-min-tokens = 1024

# To enable MTP you must reduce moe-cache-mib, which results in a net slowdown
; spec-type = draft-mtp
; spec-draft-hf = unsloth/Qwen3.8-Flash-Next-GGUF:MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0
; spec-draft-n-max = 2
; spec-draft-ngl = 99

# Thinking mode
temperature = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

[Inkling-2-Mini]
# The GGUFs in the repository root use Unsloth's looped layout and need the
# Unsloth fork. Mainline llama.cpp reads only the Mainline_Support files, whose
# .gguf_file extension is not found by the `hf = repo:quant` lookup.
hf = unsloth/Inkling-2-Mini-GGUF
hf-file = Mainline_Support/Inkling-2-Mini-UD-IQ4_XS.gguf_file

# FIXME KV cache quantizatioin (ggml-org/llama.cpp#32740)
ctx-size = 32768
flash-attn = off
cache-type-k = f16
cache-type-v = f16

# DSpark is only supported by the Unsloth fork with the root-layout GGUFs; the
# draft tensors do not load against the mainline model on stock llama.cpp.

mmproj-url = https://huggingface.co/unsloth/Inkling-2-Mini-GGUF/resolve/main/mmproj-F16.gguf
; no-mmproj-offload = true  # Keep vision tower in host RAM
; no-mmproj = true  # Disable vision entirely to save RAM

temperature = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0

[Qwen3.8-27B]
hf = byteshape/Qwen3.8-27B-GGUF:Qwen3.8-27B-IQ4_XS-3.84bpw

ctx-size = 262144
cache-type-k = q5_0
cache-type-v = q5_0

# no-mmproj-offload = true  # Keep vision tower in host RAM (-1184 MiB VRAM)
# no-mmproj = true  # Disable vision entirely to save RAM
image-min-tokens = 1024

# MTP drafter
spec-type = draft-mtp
spec-draft-ngl = 99
spec-draft-n-max = 3

# Thinking mode
temperature = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

[Ternary-Bonsai-2.5]
# Q2_0-mtp runs on stock llama.cpp. PTQ1_0-mtp is faster but needs the PrismML fork.
hf = prism-ml/Ternary-Bonsai-2.5-27B-GGUF
hf-file = Ternary-Bonsai-2.5-27B-Q2_0-mtp.gguf

ctx-size = 262144
cache-type-k = q5_0
cache-type-v = q4_0

# MTP drafter
