[workspace]
channels = ["https://prefix.dev/conda-forge"]
preview = ["pixi-build"]
platforms = ["linux-64", "linux-aarch64", "win-64"]

[tasks]
stop-server = "bash scripts/stop-server.sh"
restart-server = { depends-on = ["stop-server", "start-server"] }

[target.linux-64.tasks]
install-apparmor = "bash scripts/install-apparmor.sh"
install-bin = "bash scripts/install-bin.sh"
install-clipboard = "bash scripts/install-clipboard.sh"
install-memlock = "bash scripts/install-memlock.sh"
install = { depends-on = ["install-apparmor", "install-bin", "install-clipboard", "install-memlock"] }
uninstall = "bash scripts/uninstall-bin.sh"

[target.linux-aarch64.tasks]
install-apparmor = "bash scripts/install-apparmor.sh"
install-bin = "bash scripts/install-bin.sh"
install-clipboard = "bash scripts/install-clipboard.sh"
install-memlock = "bash scripts/install-memlock.sh"
install = { depends-on = ["install-apparmor", "install-bin", "install-clipboard", "install-memlock"] }
uninstall = "bash scripts/uninstall-bin.sh"

# Tasks invoke `bash scripts/*.sh`. On Windows, a plain `bash` from PATH would
# resolve to WSL (C:\Windows\System32\bash.exe), which discards the pixi
# environment; ship MSYS2 bash and the utilities the scripts need instead.
[target.win-64.dependencies]
m2-bash = "*"
m2-coreutils = "*"
m2-grep = "*"
m2-sed = "*"

[feature.llamacpp-source-cpu]
platforms = ["linux-64", "linux-aarch64"]

[feature.llamacpp-source-cpu.dependencies]
llama-cpp = { path = "pixi-recipes/llama-cpp-source/cpu" }

[feature.llamacpp-source-cuda]
platforms = ["linux-64"] # FIXME Linux ARM fails to compile
[feature.llamacpp-source-cuda.dependencies]
llama-cpp = { path = "pixi-recipes/llama-cpp-source/cuda" }

[feature.llamacpp-source-vulkan]
platforms = ["linux-64", "linux-aarch64"]
[feature.llamacpp-source-vulkan.dependencies]
llama-cpp = { path = "pixi-recipes/llama-cpp-source/vulkan" }

[feature.llamacpp-binary-cpu.dependencies]
llama-cpp = { path = "pixi-recipes/llama-cpp-binary/cpu" }

[feature.llamacpp-binary-vulkan.dependencies]
llama-cpp = { path = "pixi-recipes/llama-cpp-binary/vulkan" }

[feature.llamacpp-binary-rocm]
platforms = ["linux-64"]
[feature.llamacpp-binary-rocm.dependencies]
llama-cpp = { path = "pixi-recipes/llama-cpp-binary/rocm" }

[feature.llamacpp.dependencies]
# kv-perplexity dependencies
python = "=3.14"
pydantic = "*"
pyyaml = "*"

[feature.llamacpp.activation.env]
# Disable Turboquant's auto-asymmetric K-cache upgrade: on high-GQA models it
# silently rewrites a requested turbo K cache to q8_0, so -ctk no longer measures
# (or serves) what was asked for. Keep it off so K/V quant settings are honoured.
TURBO_AUTO_ASYMMETRIC = "0"

[feature.llamacpp.tasks]
llama-help = "llama-server --help"
llama-version = "llama-server --version"
llama-hello.cmd = "llama-cli -hf {{ model }} --reasoning off -st -p 'Hello world'"
llama-hello.args = [{ arg = "model", default = "unsloth/LFM2.5-230M-GGUF:Q4_K_M" }]
llama-list-devices = "llama-server --list-devices"
start-server = "bash scripts/start-server.sh"

# Quantitative benchmark on the degradation introduced by model and/or cache quantization.
# Note: the measure is only significant between two variants/settings of the same model.
# You should modify scripts/kv-perplexity-config.yaml before you start.
kv-perplexity = "scripts/kv-perplexity.py"

[feature.sandbox.target.win-64.dependencies]

[feature.sandbox.target.linux-64.dependencies]
bubblewrap = "*"

[feature.sandbox.target.linux-aarch64.dependencies]
bubblewrap = "*"

[feature.pi.dependencies]
pi-coding-agent = "*"
pi-extensions = { path = "pixi-recipes/pi-extensions" }
pi-home = { path = "pixi-recipes/pi-home" }

[feature.pi.tasks]
pi-unsafe.cmd = "bash scripts/pi-unsafe.sh {{ root_dir }}"
pi-unsafe.args = [{ arg = "root_dir", default = "-" }]
pi-export = "pi --export"

[feature.pi.target.linux-64.tasks]
pi.cmd = "bash scripts/bwrap-pi.sh {{ root_dir }}"
pi.args = [{ arg = "root_dir", default = "-" }]

[feature.pi.target.linux-aarch64.tasks]
pi.cmd = "bash scripts/bwrap-pi.sh {{ root_dir }}"
pi.args = [{ arg = "root_dir", default = "-" }]

[feature.claude.dependencies]
claude = { path = "pixi-recipes/claude" }
claude-extensions = { path = "pixi-recipes/claude-extensions" }
claude-home = { path = "pixi-recipes/claude-home" }

[feature.claude.tasks]
claude-unsafe.cmd = "bash scripts/claude-unsafe.sh {{ root_dir }}"
claude-unsafe.args = [{ arg = "root_dir", default = "-" }]

[feature.claude.target.linux-64.tasks]
claude.cmd = "bash scripts/bwrap-claude.sh {{ root_dir }}"
claude.args = [{ arg = "root_dir", default = "-" }]

[feature.claude.target.linux-aarch64.tasks]
claude.cmd = "bash scripts/bwrap-claude.sh {{ root_dir }}"
claude.args = [{ arg = "root_dir", default = "-" }]

[feature.herdr.dependencies]
herdr = { path = "pixi-recipes/herdr" }

[feature.herdr.tasks]
# Route through run-herdr.sh so children spawned inside herdr see the
# `~/.local/bin/{pi,claude}` sandbox wrappers ($CONDA_PREFIX/bin comes first
# after pixi activation and would otherwise shadow them).
herdr = "bash scripts/run-herdr.sh"

[feature.git.dependencies]
git = "*"
gh = "*"

[feature.git.tasks]
git = "git"
gh = "gh"

[feature.pytools.dependencies]
python = "=3.14"
huggingface_hub = "*"
# Install key llama-benchy dependencies from conda-forge
aiohttp = "*"
matplotlib = "*"
numpy = "*"
pydantic = "*"
requests = "*"
safetensors = "*"
tokenizers = "*"
transformers = ">=5.2.0"
# context-bench runner dependencies
openai = "*"
tomli-w = "*"

[feature.pytools.pypi-dependencies]
llama-benchy = ">=0.4.0"

[feature.pytools.tasks]
llama-benchy = "python -m llama_benchy --base-url http://localhost:8080/v1 --no-cache --runs 7"
hf = "hf"
context-bench = "python sample-data/context-bench/run_benchmark.py"
aggregate-context-bench = "python sample-data/context-bench/aggregate_benchmark_results.py"
kv-kld-report = "python scripts/kv-kld-report.py"
llama-cpp-changelog = "python scripts/llama-cpp-changelog.py"
gguf-meta-extract = "python scripts/gguf-meta-extract.py"

[feature.lint.dependencies]
lefthook = "*"
actionlint = "*"
shellcheck = "*" # Runs inside actionlint
pyflakes = "*" # Runs inside actionlint
ruff = "*"
blacken-docs = "*"
dprint = "*"
codespell = "*"

[feature.lint.tasks]
install-git-hooks = { cmd = "lefthook install", description = "Install pre-commit hooks" }
update-dprint = { cmd = "dprint config update", description = "Update dprint plugins" }
lint = { cmd = "lefthook run pre-commit --all-files --force", description = "Run all linters" }

[environments]
llamacpp-source-cpu = ["llamacpp", "llamacpp-source-cpu"]
llamacpp-source-cuda = ["llamacpp", "llamacpp-source-cuda"]
llamacpp-source-vulkan = ["llamacpp", "llamacpp-source-vulkan"]
llamacpp-binary-cpu = ["llamacpp", "llamacpp-binary-cpu"]
llamacpp-binary-rocm = ["llamacpp", "llamacpp-binary-rocm"]
llamacpp-binary-vulkan = ["llamacpp", "llamacpp-binary-vulkan"]
agents = ["pi", "claude", "sandbox", "git", "herdr", "pytools"]
lint = { features = ["lint"], no-default-feature = true }
