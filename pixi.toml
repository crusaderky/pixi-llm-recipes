[workspace]
channels = ["https://prefix.dev/conda-forge"]
preview = ["pixi-build"]
platforms = ["linux-64"]

[workspace.build-variants]
backend = ["cuda"]

[feature.llama.dependencies]
llama-cpp = { path = "pixi-recipes/llama-cpp" }

[feature.llama.tasks]
list-devices = "llama-server --list-devices"
serve-qwen36 = "llama-server -hf byteshape/Qwen3.6-35B-A3B-MTP-GGUF:IQ4_XS -lv 4 -c 131072 --no-mmap --cache-type-k q8_0 --cache-type-v q8_0 --image-min-tokens 1024 --spec-type draft-mtp --spec-draft-n-max 3 --flash-attn on --no-mmproj --jinja --fit-target 256"

[feature.pi.dependencies]
pi-coding-agent = "*"
pi-extensions = { path = "pixi-recipes/pi-extensions" }
bubblewrap = "*"

[feature.pi.tasks]
pi = { cmd = "./bwrap-pi.sh {{ root_dir }}", args = ["root_dir"] }
pi-export = "pi --export"

[feature.forge.dependencies]
python = "=3.14"

[feature.forge.pypi-dependencies]
forge-guardrails = "*"

[feature.forge.tasks]
forge-proxy = "python -m forge.proxy --backend-url http://localhost:8080 --port 8081"

[environments]
llama = [ "llama" ]
pi = [ "pi" ]
forge = [ "forge" ]
