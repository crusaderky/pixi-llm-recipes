[workspace]
channels = ["https://prefix.dev/conda-forge"]
preview = ["pixi-build"]
platforms = ["linux-64"]

[workspace.build-variants]
backend = ["cuda"]

[feature.llama.dependencies]
llama-cpp = { path = "pixi-recipes/llama-cpp" }

[feature.llama.tasks]
serve = "llama-server --models-preset models.ini"
list-devices = "llama-server --list-devices"
# Argument must be one from models.ini
download-model = { cmd = "llama-cli -hf {{ model }} -st -p 'Hello world'", args = [ "model"] }

# Crude quality benchmark.
# Typically you want to pass -hf <model> --cache-type-k q8_0 --cache-type-v q8_0
# Note: the measure only matters between two variants/settings of the same model.
llama-perplexity = "llama-perplexity -f wikitext-2-raw/wiki.test.raw"

[feature.pi.dependencies]
pi-coding-agent = "*"
pi-extensions = { path = "pixi-recipes/pi-extensions" }
bubblewrap = "*"

[feature.pi.tasks]
pi = { cmd = "scripts/bwrap-pi.sh {{ root_dir }}", args = [{ arg = "root_dir", default = "-" }] }
unsafe-pi = { cmd = "scripts/unsafe-pi.sh {{ root_dir }}", args = [{ arg = "root_dir", default = "-" }] }
pi-export = "pi --export"

[feature.openclaw.dependencies]
openclaw = { path = "pixi-recipes/openclaw" }

[feature.llama-benchy.dependencies]
python = "=3.14"

[feature.llama-benchy.pypi-dependencies]
llama-benchy = "*"

[feature.llama-benchy.tasks]
llama-benchy = "python -m llama_benchy --base-url http://localhost:8080 --no-cache --runs 7"

[environments]
llama = [ "llama", ]
llama-benchy = [ "llama-benchy" ]
pi = [ "pi" ]
openclaw = [ "openclaw" ]
