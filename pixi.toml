[workspace]
channels = ["https://prefix.dev/conda-forge"]
preview = ["pixi-build"]
platforms = ["linux-64"]

[workspace.build-variants]
backend = ["cuda"]

[feature.llama.dependencies]
llama-cpp = { path = "pixi-recipes/llama-cpp" }

[feature.llama.activation.env]
LLAMA_ARGS = "-hf byteshape/Qwen3.6-35B-A3B-MTP-GGUF:IQ4_XS -lv 4 --no-mmap --cache-type-k q8_0 --cache-type-v q8_0 --flash-attn on --fit-target 256"
LLAMA_SERVER_ARGS = "-c 131072 --image-min-tokens 1024 --spec-type draft-mtp --spec-draft-n-max 3 --no-mmproj --jinja"

[feature.llama.tasks]
list-devices = "llama-server --list-devices"
serve = "llama-server $LLAMA_ARGS $LLAMA_SERVER_ARGS"
speed-benchmark = "llama-cli $LLAMA_ARGS $LLAMA_SERVER_ARGS -st -f wikitext-2-raw/speed-bench-prompt.txt"
perplexity = "llama-perplexity $LLAMA_ARGS -c 65536 -f wikitext-2-raw/wiki.test.raw"

[feature.pi.dependencies]
pi-coding-agent = "*"
pi-extensions = { path = "pixi-recipes/pi-extensions" }
bubblewrap = "*"

[feature.pi.tasks]
pi = { cmd = "scripts/bwrap-pi.sh {{ root_dir }}", args = [{ arg = "root_dir", default = "-" }] }
unsafe-pi = { cmd = "scripts/unsafe-pi.sh {{ root_dir }}", args = [{ arg = "root_dir", default = "-" }] }
pi-export = "pi --export"

[feature.forge.dependencies]
python = "=3.14"

[feature.forge.pypi-dependencies]
forge-guardrails = "*"

[feature.forge.tasks]
forge-proxy = "python -m forge.proxy --backend-url http://localhost:8080 --port 8081"

[environments]
llama = [ "llama" ]
pi = [ "pi" ]
forge = [ "forge" ]
